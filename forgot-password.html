<!DOCTYPE html>
<html lang="de" dir="rtl">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>نسيت كلمة المرور – Deutsch Einfach</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f8f8f8, #ffffff);
            color: #222;
        }

        .container {
            width: 90%;
            max-width: 500px;
            margin: auto;
            padding: 40px 20px;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 25px;
            padding: 11px 18px;
            background: #111;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            transition: 0.3s;
        }

        .back-button:hover {
            background: #333;
            transform: translateY(-2px);
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.10);
        }

        h1 {
            text-align: center;
            color: #d60000;
            margin-top: 0;
            margin-bottom: 15px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
            line-height: 1.8;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #d60000;
        }

        .reset-button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #d60000;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .reset-button:hover {
            background: #a80000;
            transform: translateY(-2px);
        }

        .reset-button:disabled {
            background: #999;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            line-height: 1.8;
            font-size: 15px;
        }

        .success {
            display: block;
            background: #e9f8ee;
            color: #176b35;
            border: 1px solid #b9e5c7;
        }

        .error {
            display: block;
            background: #fff0f0;
            color: #a80000;
            border: 1px solid #f0b5b5;
        }

        .resend-button {
            display: none;
            width: 100%;
            margin-top: 12px;
            padding: 12px;
            border: 2px solid #d60000;
            border-radius: 10px;
            background: white;
            color: #d60000;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .resend-button:hover {
            background: #fff5f5;
        }

        .login-text {
            text-align: center;
            margin-top: 25px;
            color: #555;
        }

        .login-text a {
            color: #d60000;
            font-weight: bold;
            text-decoration: none;
        }

        .login-text a:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>

    <div class="container">

        <a href="login.html" class="back-button">
            ← الرجوع لتسجيل الدخول
        </a>


        <div class="card">

            <h1>
                نسيت كلمة المرور؟
            </h1>


            <p class="subtitle">

                ماشي مشكل ❤️

                <br>

                دخل البريد الإلكتروني ديالك وغادي نعاونوك تسترجع كلمة المرور.

            </p>


            <form id="reset-form">

                <label for="email">
                    البريد الإلكتروني
                </label>


                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="example@gmail.com"
                    required
                >


                <button
                    type="submit"
                    class="reset-button"
                    id="reset-button"
                >
                    إرسال رابط الاسترجاع
                </button>

            </form>


            <div id="message" class="message"></div>


            <button
                type="button"
                class="resend-button"
                id="resend-button"
            >
                إعادة إرسال الرابط
            </button>


            <p class="login-text">

                تذكرت كلمة المرور؟

                <a href="login.html">
                    تسجيل الدخول
                </a>

            </p>

        </div>

    </div>


    <!-- Firebase -->

    <script type="module">

        import { initializeApp }
        from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

        import {
            getAuth,
            sendPasswordResetEmail
        }
        from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


        // Firebase configuration
        // استعمل نفس المعلومات الموجودة في signup.html

        const firebaseConfig = {

            apiKey: "AIzaSyDHMmaHLYRRHfdRDj-hf7s5LOqeWPTiOxU",
            authDomain: "deutsch-einfach-4c81f.firebaseapp.com",
            projectId: "deutsch-einfach-4c81f",
            storageBucket: "deutsch-einfach-4c81f.firebasestorage.app",
            messagingSenderId: "152448766933",
            appId: "1:152448766933:web:f7824c4db8ab3caccbe35c",
        };


        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);


        const form = document.getElementById("reset-form");

        const emailInput = document.getElementById("email");

        const button = document.getElementById("reset-button");

        const message = document.getElementById("message");

        const resendButton = document.getElementById("resend-button");


        async function sendResetLink() {

            const email = emailInput.value.trim();


            if (!email) {

                showError("دخل البريد الإلكتروني ديالك ❌");

                return;

            }


            button.disabled = true;

            resendButton.style.display = "none";

            message.className = "message";

            message.textContent = "";


            try {

                await sendPasswordResetEmail(
                    auth,
                    email
                );


                message.className = "message success";

                message.innerHTML =
                    "تم إرسال رابط تغيير كلمة المرور إلى بريدك الإلكتروني ✅" +
                    "<br><br>" +
                    "إلا ما لقيتيش الرسالة، شوف <strong>Spam / Courrier indésirable</strong> 📩";


                resendButton.style.display = "block";


            }

            catch (error) {

                console.log(error);


                if (error.code === "auth/invalid-email") {

                    showError("الإيميل غير صحيح ❌");

                }

                else {

                    showError(
                        "ما قدرناش نرسلو الرابط دابا ❌<br>" +
                        "تأكد من الإيميل وحاول مرة أخرى."
                    );

                }

            }


            button.disabled = false;

        }


        function showError(text) {

            message.className = "message error";

            message.innerHTML = text;

        }


        form.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();

                sendResetLink();

            }
        );


        resendButton.addEventListener(
            "click",
            function() {

                sendResetLink();

            }
        );

    </script>


</body>

</html>
```
