<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<script src="assets/https-upgrade.js?v=473efbeb"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>نسيت كلمة المرور – Deutsch Einfach</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/theme.css?v=70c1b456">
<style>
:root {
  --bg: #fdfdff;
  --bg-soft: #ffffff;
  --surface: #ffffff;
  --surface-2: #f7f8fc;
  --border: rgba(20,22,31,.10);
  --border-strong: rgba(225,29,51, 0.35);
  --gold: var(--brand);
  --gold-light: var(--brand-light);
  --gold-dark: var(--brand-dark);
  --text: #14161f;
  --text-dim: #5b6172;
  --text-faint: #858b9c;
  --shadow-gold: 0 0 40px -10px rgba(225,29,51, 0.25);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: "Cairo", "IBM Plex Sans Arabic", system-ui, sans-serif;
  direction: rtl;
  text-align: right;
  line-height: 1.7;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  position: relative;
  overflow-x: hidden;
}

a { color: inherit; text-decoration: none; }

body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -2;
  background:
    radial-gradient(circle at 15% 10%, rgba(225,29,51, 0.10), transparent 40%),
    radial-gradient(circle at 85% 30%, rgba(225,29,51, 0.06), transparent 45%),
    linear-gradient(180deg, #fdfdff 0%, var(--paper, #faf9f7) 100%);
}

.bg-grid {
  position: fixed;
  inset: 0;
  z-index: -1;
  background-size: 44px 44px;
  background-image:
    linear-gradient(to right, rgba(225,29,51, 0.04) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(225,29,51, 0.04) 1px, transparent 1px);
  -webkit-mask-image: radial-gradient(circle at 50% 30%, black 0%, transparent 70%);
  mask-image: radial-gradient(circle at 50% 30%, black 0%, transparent 70%);
}

.auth-wrap {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.back-button {
  position: fixed;
  top: 24px;
  right: 24px;
  padding: 10px 18px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text-dim);
  border-radius: 10px;
  font-weight: 700;
  font-size: 13.5px;
  transition: 0.2s;
}

.back-button:hover {
  border-color: var(--border-strong);
  color: var(--gold-dark);
  transform: translateY(-2px);
}

.auth-card {
  width: 100%;
  max-width: 460px;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: 24px;
  padding: 40px 34px;
  box-shadow: var(--shadow-gold);
}

h1 {
  text-align: center;
  font-size: clamp(22px, 3vw, 27px);
  font-weight: 900;
  margin: 0 0 12px;
  background: linear-gradient(135deg, var(--brand-light), var(--gold));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.subtitle {
  text-align: center;
  color: var(--text-dim);
  font-size: 15px;
  margin-bottom: 30px;
  line-height: 1.8;
}

label {
  display: block;
  font-size: 13.5px;
  font-weight: 700;
  margin-bottom: 8px;
  color: var(--text-dim);
}

input {
  width: 100%;
  padding: 13px 16px;
  margin-bottom: 20px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--bg-soft);
  color: var(--text);
  font-family: inherit;
  font-size: 15px;
  outline: none;
  transition: 0.2s;
  direction: ltr;
  text-align: left;
}

input::placeholder { color: var(--text-faint); }

input:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(225,29,51, 0.15);
}

.reset-button {
  width: 100%;
  border: none;
  padding: 14px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--brand-light), var(--gold) 55%, var(--gold-dark));
  color: #fff;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
  transition: 0.25s ease;
  box-shadow: var(--shadow-gold);
}

.reset-button:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 30px -8px rgba(225,29,51, 0.45);
}

.reset-button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
}

.message {
  display: none;
  margin-top: 20px;
  padding: 14px 16px;
  border-radius: 12px;
  text-align: center;
  line-height: 1.8;
  font-size: 14px;
}

.message.success {
  display: block;
  background: rgba(34, 197, 94, 0.1);
  border: 1px solid rgba(34, 197, 94, 0.3);
  color: #86efac;
}

.message.error {
  display: block;
  background: rgba(220, 38, 38, 0.12);
  border: 1px solid rgba(220, 38, 38, 0.35);
  color: #fca5a5;
}

.resend-button {
  display: none;
  width: 100%;
  margin-top: 12px;
  padding: 12px;
  border: 2px solid var(--gold);
  border-radius: 10px;
  background: transparent;
  color: var(--gold-dark);
  font-size: 14.5px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  transition: 0.2s;
}

.resend-button:hover {
  background: rgba(225,29,51, 0.08);
}

.login-text {
  text-align: center;
  margin-top: 24px;
  font-size: 14px;
  color: var(--text-dim);
}

.login-text a {
  color: var(--gold-dark);
  font-weight: 700;
}

.login-text a:hover { text-decoration: underline; }

@media (max-width: 480px) {
  body { padding: 16px; }
  .back-button {
    position: static;
    display: inline-block;
    margin-bottom: 18px;
  }
  .auth-wrap { flex-direction: column; align-items: stretch; }
  .auth-card { padding: 30px 22px; border-radius: 20px; }
}

@media (min-width: 700px) and (max-width: 1024px) {
  .auth-card { max-width: 500px; padding: 46px 40px; }
}

@media (min-width: 1440px) {
  .auth-card { max-width: 520px; padding: 52px 46px; }
  h1 { font-size: 30px; }
  .subtitle { font-size: 16px; }
  input { padding: 15px 18px; font-size: 16px; }
  .reset-button { padding: 16px; font-size: 17px; }
}

@media (min-width: 2200px) {
  .auth-card { max-width: 640px; padding: 64px 56px; border-radius: 30px; }
  h1 { font-size: 38px; }
  .subtitle { font-size: 19px; }
  label { font-size: 16px; }
  input { padding: 18px 22px; font-size: 19px; border-radius: 14px; margin-bottom: 22px; }
  .reset-button { padding: 20px; font-size: 20px; border-radius: 14px; }
  .resend-button { font-size: 17px; padding: 16px; }
  .login-text { font-size: 16px; }
  .back-button { font-size: 16px; padding: 13px 22px; }
}

/* التيليفون: الزر ديال الرجوع فوق والفورم تحتو —
   ماشي جنب بعضياتهم (كان الفورم كيتعصر ف 240px). */
@media (max-width: 640px) {
  body { flex-direction: column; align-items: stretch; justify-content: flex-start; gap: 14px; }
  .back-button { position: static !important; align-self: flex-start; margin: 0 !important; }
}
</style>
</head>

<body>
<div class="bg-grid"></div>

<a href="login.html" class="back-button">← الرجوع لتسجيل الدخول</a>

<div class="auth-wrap">
  <div class="auth-card">

    <h1>نسيت كلمة المرور؟</h1>
    <p class="subtitle">
      ماشي مشكل ❤️
      <br>
      دخل البريد الإلكتروني ديالك وغادي نعاونوك تسترجع كلمة المرور.
    </p>

    <form id="reset-form">
      <label for="email">البريد الإلكتروني</label>
      <input type="email" id="email" name="email" placeholder="example@gmail.com" required>

      <button type="submit" class="reset-button" id="reset-button">إرسال رابط الاسترجاع</button>
    </form>

    <div id="message" class="message"></div>

    <button type="button" class="resend-button" id="resend-button">إعادة إرسال الرابط</button>

    <p class="login-text">
      تذكرت كلمة المرور؟
      <a href="login.html">تسجيل الدخول</a>
    </p>

  </div>
</div>

<!-- Firebase -->
<script type="module">

        import { initializeApp }
        from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

        import {
            getAuth,
            sendPasswordResetEmail
        }
        from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


        // Firebase configuration
        // استعمل نفس المعلومات الموجودة في signup.html

        const firebaseConfig = {

            apiKey: "AIzaSyDHMmaHLYRRHfdRDj-hf7s5LOqeWPTiOxU",
            authDomain: "deutsch-einfach-4c81f.firebaseapp.com",
            projectId: "deutsch-einfach-4c81f",
            storageBucket: "deutsch-einfach-4c81f.firebasestorage.app",
            messagingSenderId: "152448766933",
            appId: "1:152448766933:web:f7824c4db8ab3caccbe35c",
        };


        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);


        const form = document.getElementById("reset-form");

        const emailInput = document.getElementById("email");

        const button = document.getElementById("reset-button");

        const message = document.getElementById("message");

        const resendButton = document.getElementById("resend-button");


        async function sendResetLink() {

            const email = emailInput.value.trim();


            if (!email) {

                showError("دخل البريد الإلكتروني ديالك ❌");

                return;

            }


            button.disabled = true;

            resendButton.style.display = "none";

            message.className = "message";

            message.textContent = "";


            try {

                await sendPasswordResetEmail(
                    auth,
                    email
                );


                message.className = "message success";

                message.innerHTML =
                    "تصيفط رابط تغيير كلمة المرور لبريدك ✅" +
                    "<br><br>" +
                    "كيوصل ف دقيقة ولا جوج. إلا ما لقيتيهش، شوف " +
                    "<strong>Spam / Courrier indésirable</strong> 📩<br>" +
                    "المُرسِل: <strong>noreply@deutsch-einfach-4c81f.firebaseapp.com</strong>";


                resendButton.style.display = "block";


            }

            catch (error) {

                console.error("RESET ERROR:", error);


                /* بلا السبب الحقيقي، مستحيل تعرف علاش ما وصلش
                   الإيميل. كنبينوه بحال ما درنا ف تسجيل الدخول. */
                const code = (error && error.code) || "";

                if (code === "auth/invalid-email") {

                    showError("الإيميل غير صحيح ❌");

                }

                else if (code === "auth/user-not-found") {

                    showError(
                        "ماكاينش حساب بهاد الإيميل ❌<br>" +
                        "تأكد من الكتابة، ولا صاوب حساب جديد."
                    );

                }

                else if (code === "auth/too-many-requests") {

                    showError(
                        "حاولتي بزاف ديال المرات ⚠️<br>" +
                        "تسنى شوية وعاود."
                    );

                }

                else if (code === "auth/network-request-failed") {

                    showError(
                        "ماكاينش اتصال بالأنترنيت ❌<br>" +
                        "شوف الشبكة وعاود."
                    );

                }

                else {

                    showError(
                        "ما قدرناش نرسلو الرابط دابا ❌<br>" +
                        "السبب: <code>" + (code || error.message || "مجهول") + "</code>"
                    );

                }

            }


            button.disabled = false;

        }


        function showError(text) {

            message.className = "message error";

            message.innerHTML = text;

        }


        form.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();

                sendResetLink();

            }
        );


        resendButton.addEventListener(
            "click",
            function() {

                sendResetLink();

            }
        );

    </script>

</body>
</html>
