<style>

    background: #241f1f;
    border-color: #3a3a3a;
  }

    font-size: 16px;

  }

    height: 44px;

    align-items: center;

    { href: "fuer-die-polizei-in-berlin.html", title: "Für die Polizei in Berlin" }
  ];

  var stack = document.getElementById("hoeren-teil1-stack");
  if (!stack) return;

  var frag = document.createDocumentFragment();

  THEMES.forEach(function (theme, i) {
    var item = document.createElement("div");
    item.className = "theme-item";
    item.id = "theme-item-" + (i + 1);

    var header = document.createElement("div");
    header.className = "theme-item-header";
    header.innerHTML =
      '<span class="theme-item-index">' + (i + 1) + '</span>' +
      '<span class="theme-item-title">' + theme.title + '</span>' +
      '<i class="fa-solid fa-chevron-down theme-item-chevron"></i>';

    header.addEventListener("click", function () {
      item.classList.toggle("collapsed");
    });

    item.appendChild(header);

    if (theme.questions && theme.questions.length) {
      item.appendChild(buildNativeQuiz(theme));
    } else {
      /*
         IMPORTANT:
         Each Thema has its own complete HTML exercise page.
         We load that real page inside the same cadre instead
         of showing an "Öffnen" placeholder.
      */
      var iframeWrap = document.createElement("div");
      iframeWrap.className = "theme-iframe-wrap";

      var loading = document.createElement("div");
      loading.className = "theme-iframe-loading";
      loading.innerHTML = '<i class="fa-solid fa-spinner"></i> Wird geladen…';
      iframeWrap.appendChild(loading);

      var iframe = document.createElement("iframe");
      iframe.className = "theme-iframe";
      iframe.src = theme.href;
      iframe.loading = "lazy";
      iframe.title = theme.title;
      iframe.setAttribute("scrolling", "no");
      iframe.setAttribute("frameborder", "0");

      function resizeAndClean() {
        try {
          var doc = iframe.contentWindow.document;

          /* Keep the exercise itself, but remove the duplicated
             page chrome because the Thema already has our outer cadre. */
          [
            ".top-header",
            ".breadcrumb",
            ".quiz-header",
            ".info-row",
            ".page-footer"
          ].forEach(function(selector) {
            var el = doc.querySelector(selector);
            if (el) el.style.display = "none";
          });

          if (doc.body) {
            doc.body.style.margin = "0";
            doc.body.style.background = "transparent";
            doc.body.style.minHeight = "0";
          }

          var page = doc.querySelector(".quiz-page");
          if (page) {
            page.style.maxWidth = "none";
            page.style.padding = "0";
          }

          var quiz = doc.querySelector(".quiz-container");
          if (quiz) {
            quiz.style.marginTop = "0";
            quiz.style.borderRadius = "0";
            quiz.style.boxShadow = "none";
            quiz.style.borderLeft = "0";
            quiz.style.borderRight = "0";
            quiz.style.borderBottom = "0";
          }

          var h = Math.max(
            doc.documentElement ? doc.documentElement.scrollHeight : 0,
            doc.body ? doc.body.scrollHeight : 0
          );

          if (h > 0) iframe.style.height = h + "px";
        } catch (e) {
          iframe.style.height = "850px";
        }
      }

      iframe.addEventListener("load", function () {
        loading.style.display = "none";
        resizeAndClean();

        /* Recalculate after fonts/scripts finish rendering. */
        setTimeout(resizeAndClean, 300);
        setTimeout(resizeAndClean, 1000);
        setTimeout(resizeAndClean, 2000);
      });

      iframeWrap.appendChild(iframe);
      item.appendChild(iframeWrap);
    }

    frag.appendChild(item);
  });

  /* ==========================================
     BUILD A NATIVE RICHTIG/FALSCH QUIZ
     (rendered directly inside the theme-item
     cadre — no iframe, nothing external to load)
  ========================================== */
  function buildNativeQuiz(theme) {
    var qid = theme.quizId || theme.href.replace(/[^a-z0-9]/gi, "_");

    var wrap = document.createElement("div");
    wrap.className = "native-quiz-wrap";

    var intro = document.createElement("p");
    intro.className = "nq-intro";
    intro.textContent = "Höre die Informationen aufmerksam und entscheide: Richtig oder Falsch?";
    wrap.appendChild(intro);

    var rows = [];

    theme.questions.forEach(function (q, i) {
      var row = document.createElement("div");
      row.className = "nq-question-row";

      var textEl = document.createElement("div");
      textEl.className = "nq-question-text";
      var numEl = document.createElement("span");
      numEl.className = "nq-question-number";
      numEl.textContent = (i + 1);
      textEl.appendChild(numEl);
      textEl.appendChild(document.createTextNode(q.text));
      row.appendChild(textEl);

      var answers = document.createElement("div");
      answers.className = "nq-answers";

      ["richtig", "falsch"].forEach(function (val) {
        var label = document.createElement("label");
        label.className = "nq-radio-option";

        var input = document.createElement("input");
        input.type = "radio";
        input.name = qid + "_q" + (i + 1);
        input.value = val;

        label.appendChild(input);
        label.appendChild(document.createTextNode(val === "richtig" ? "Richtig" : "Falsch"));
        answers.appendChild(label);
      });

      row.appendChild(answers);
      wrap.appendChild(row);
      rows.push({ row: row, textEl: textEl, name: qid + "_q" + (i + 1), answer: q.answer });
    });

    function clearReveal() {
      rows.forEach(function (r) {
        r.row.classList.remove("nq-correct", "nq-wrong");
        r.row.querySelectorAll(".nq-radio-option").forEach(function (l) {
          l.classList.remove("nq-correct-opt");
        });
        var badge = r.textEl.querySelector(".nq-solution-badge");
        if (badge) badge.remove();
      });
    }

    var resultBox = document.createElement("div");
    resultBox.className = "nq-result-box";
    resultBox.setAttribute("aria-live", "polite");

    var actions = document.createElement("div");
    actions.className = "nq-action-buttons";

    var btnCheck = document.createElement("button");
    btnCheck.type = "button";
    btnCheck.className = "nq-btn nq-btn-check";
    btnCheck.innerHTML = '<i class="fa-solid fa-check-double"></i> Antworten prüfen';
    btnCheck.addEventListener("click", function () {
      clearReveal();
      var score = 0;
      rows.forEach(function (r) {
        var selected = wrap.querySelector('input[name="' + r.name + '"]:checked');
        if (!selected) return;
        if (selected.value === r.answer) {
          score++;
          r.row.classList.add("nq-correct");
        } else {
          r.row.classList.add("nq-wrong");
        }
      });
      var total = rows.length;
      if (score === total) {
        resultBox.innerHTML = '<span class="nq-result-success"><i class="fa-solid fa-trophy"></i> ' + score + ' von ' + total + ' richtig – Sehr gut!</span>';
      } else {
        resultBox.innerHTML = '<span class="nq-result-info"><i class="fa-solid fa-chart-simple"></i> ' + score + ' von ' + total + ' richtig</span>';
      }
    });

    var btnShow = document.createElement("button");
    btnShow.type = "button";
    btnShow.className = "nq-btn nq-btn-show";
    btnShow.innerHTML = '<i class="fa-solid fa-eye"></i> Antworten anzeigen';
    btnShow.addEventListener("click", function () {
      clearReveal();
      rows.forEach(function (r) {
        r.row.querySelectorAll('input[name="' + r.name + '"]').forEach(function (input) {
          var label = input.closest(".nq-radio-option");
          if (label && input.value === r.answer) label.classList.add("nq-correct-opt");
        });
        var badge = document.createElement("span");
        badge.className = "nq-solution-badge";
        badge.innerHTML = '<i class="fa-solid fa-lightbulb"></i> Lösung: ' + (r.answer === "richtig" ? "Richtig" : "Falsch");
        r.textEl.appendChild(badge);
      });
      resultBox.innerHTML = '<span class="nq-result-info"><i class="fa-solid fa-eye"></i> Die richtigen Antworten werden angezeigt. Du kannst die Aufgabe jetzt noch einmal versuchen.</span>';
    });

    var btnRetry = document.createElement("button");
    btnRetry.type = "button";
    btnRetry.className = "nq-btn nq-btn-retry";
    btnRetry.innerHTML = '<i class="fa-solid fa-rotate-right"></i> Nochmal versuchen';
    btnRetry.addEventListener("click", function () {
      rows.forEach(function (r) {
        r.row.querySelectorAll('input[name="' + r.name + '"]').forEach(function (input) {
          input.checked = false;
        });
      });
      clearReveal();
      resultBox.innerHTML = "";
    });

    actions.appendChild(btnCheck);
    actions.appendChild(btnShow);
    actions.appendChild(btnRetry);
    wrap.appendChild(actions);
    wrap.appendChild(resultBox);

    return wrap;
  }

  stack.appendChild(frag);

  window.addEventListener("resize", function () {
    document.querySelectorAll(".theme-iframe").forEach(function (f) {
      try {
        var doc = f.contentWindow.document;
        var h = Math.max(
          doc.documentElement ? doc.documentElement.scrollHeight : 0,
          doc.body ? doc.body.scrollHeight : 0
        );
        if (h > 0) f.style.height = h + "px";
      } catch (e) {}
    });
  });
})();
</script>
<script>
let pingTimeout;
let logoutTimer;
let warningTimer;
let countdownTimer;
let lastPing = 0;

const INACTIVITY_LIMIT = 15 * 60 * 1000; // 15 minutes
const WARNING_BEFORE_LOGOUT = 30 * 1000; // 30 seconds
const warningBox = document.getElementById("warningBox");
const countdownEl = document.getElementById("countdown");

function sendPing() {
    const now = Date.now();
    if (now - lastPing < 10000) return; 
    lastPing = now;
    if (navigator.sendBeacon && navigator.sendBeacon("/ping")) { return; }
    fetch("/ping", { keepalive: true }).catch(() => {});
}

function resetTimers() {
    clearTimeout(pingTimeout);
    clearTimeout(logoutTimer);
    clearTimeout(warningTimer);
    clearInterval(countdownTimer);

    warningBox.style.display = "none"; // 🟡 hide warning if active again

    sendPing();
    pingTimeout = setTimeout(sendPing, 60 * 1000);

    // Show warning 30s before logout
    warningTimer = setTimeout(() => {
        let remaining = 30;
        warningBox.style.display = "block";
        countdownEl.textContent = remaining;

        countdownTimer = setInterval(() => {
            remaining--;
            countdownEl.textContent = remaining;
            if (remaining <= 0) {
                clearInterval(countdownTimer);
            }
        }, 1000);
    }, INACTIVITY_LIMIT - WARNING_BEFORE_LOGOUT);

    // Auto logout
    logoutTimer = setTimeout(() => {
        fetch("/logout", { method: "POST" })
          .then(() => { window.location.href = (window.TelcLevelNav && TelcLevelNav.getDashboardHref()) || 'dashboard.html'; });
    }, INACTIVITY_LIMIT);
}

// Events
["mousemove", "keydown", "scroll", "click", "touchstart"].forEach(evt => {
    document.addEventListener(evt, resetTimers);
});

window.addEventListener("pageshow", sendPing);
window.addEventListener("pagehide", sendPing);

resetTimers();
</script>
