<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>إنشاء حساب – Deutsch Einfach</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/theme.css">
<style>
/* ============================================
   Deutsch Einfach — Thème Noir & Or
   Design responsive: mobile / tablette / PC / grand écran
   ============================================ */

:root {
  --bg: #08090c;
  --bg-soft: #0d0f14;
  --surface: #121419;
  --surface-2: #181b22;
  --border: rgba(255, 255, 255, 0.08);
  --border-strong: rgba(212, 175, 55, 0.35);
  --gold: #d4af37;
  --gold-light: #f4e5a1;
  --gold-dark: #a8842a;
  --text: #f5f4f0;
  --text-dim: #b9b6ad;
  --text-faint: #7c7a72;
  --radius: 18px;
  --shadow-gold: 0 0 40px -10px rgba(212, 175, 55, 0.25);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: "Cairo", "IBM Plex Sans Arabic", system-ui, sans-serif;
  direction: rtl;
  text-align: right;
  line-height: 1.7;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  position: relative;
  overflow-x: hidden;
}

a {
  color: inherit;
  text-decoration: none;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -2;
  background:
    radial-gradient(circle at 15% 10%, rgba(212, 175, 55, 0.10), transparent 40%),
    radial-gradient(circle at 85% 30%, rgba(212, 175, 55, 0.06), transparent 45%),
    linear-gradient(180deg, #08090c 0%, #0a0b10 100%);
}

.bg-grid {
  position: fixed;
  inset: 0;
  z-index: -1;
  background-size: 44px 44px;
  background-image:
    linear-gradient(to right, rgba(212, 175, 55, 0.04) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(212, 175, 55, 0.04) 1px, transparent 1px);
  -webkit-mask-image: radial-gradient(circle at 50% 30%, black 0%, transparent 70%);
  mask-image: radial-gradient(circle at 50% 30%, black 0%, transparent 70%);
}

.auth-wrap {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.back-button {
  position: fixed;
  top: 24px;
  right: 24px;
  padding: 10px 18px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text-dim);
  border-radius: 10px;
  font-weight: 700;
  font-size: 13.5px;
  transition: 0.2s;
}

.back-button:hover {
  border-color: var(--border-strong);
  color: var(--gold-light);
}

.auth-card {
  width: 100%;
  max-width: 460px;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: 24px;
  padding: 40px 34px;
  box-shadow: var(--shadow-gold);
}

h1 {
  text-align: center;
  font-size: clamp(22px, 3vw, 27px);
  font-weight: 900;
  margin: 0 0 10px;
  background: linear-gradient(135deg, var(--gold-light), var(--gold));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.subtitle {
  text-align: center;
  color: var(--text-dim);
  font-size: 14px;
  margin-bottom: 30px;
  line-height: 1.7;
}

label {
  display: block;
  font-size: 13.5px;
  font-weight: 700;
  margin-bottom: 8px;
  color: var(--text-dim);
}

input {
  width: 100%;
  padding: 13px 16px;
  margin-bottom: 18px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--bg-soft);
  color: var(--text);
  font-family: inherit;
  font-size: 15px;
  outline: none;
  transition: 0.2s;
  direction: ltr;
  text-align: left;
}

input::placeholder {
  color: var(--text-faint);
}

input:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
}

.signup-submit {
  width: 100%;
  border: none;
  padding: 14px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--gold-light), var(--gold) 55%, var(--gold-dark));
  color: #1a1400;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
  transition: 0.25s ease;
  margin-top: 4px;
  box-shadow: var(--shadow-gold);
}

.signup-submit:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 30px -8px rgba(212, 175, 55, 0.45);
}

.signup-submit:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
}

.login-text {
  text-align: center;
  margin-top: 24px;
  font-size: 14px;
  color: var(--text-dim);
}

.login-text a {
  color: var(--gold-light);
  font-weight: 700;
}

.login-text a:hover {
  text-decoration: underline;
}

/* ============================================
   Responsive — mobile / tablette / PC / TV
   ============================================ */

@media (max-width: 480px) {
  body {
    padding: 16px;
  }
  .back-button {
    position: static;
    display: inline-block;
    margin-bottom: 18px;
  }
  .auth-wrap {
    flex-direction: column;
    align-items: stretch;
  }
  .auth-card {
    padding: 30px 22px;
    border-radius: 20px;
  }
}

@media (min-width: 700px) and (max-width: 1024px) {
  .auth-card {
    max-width: 500px;
    padding: 46px 40px;
  }
}

@media (min-width: 1440px) {
  .auth-card {
    max-width: 520px;
    padding: 52px 46px;
  }
  h1 {
    font-size: 30px;
  }
  .subtitle {
    font-size: 15px;
  }
  input {
    padding: 15px 18px;
    font-size: 16px;
  }
  .signup-submit {
    padding: 16px;
    font-size: 17px;
  }
}

@media (min-width: 2200px) {
  .auth-card {
    max-width: 640px;
    padding: 64px 56px;
    border-radius: 30px;
  }
  h1 {
    font-size: 38px;
  }
  .subtitle {
    font-size: 18px;
  }
  label {
    font-size: 16px;
  }
  input {
    padding: 18px 22px;
    font-size: 19px;
    border-radius: 14px;
    margin-bottom: 22px;
  }
  .signup-submit {
    padding: 20px;
    font-size: 20px;
    border-radius: 14px;
  }
  .login-text {
    font-size: 16px;
  }
  .back-button {
    font-size: 16px;
    padding: 13px 22px;
  }
}

/* ===== إظهار كلمة المرور ===== */
.password-wrap { position: relative; }

.password-wrap input { padding-inline-start: 46px; }

.password-toggle {
    position: absolute;
    inset-inline-start: 6px;
    top: 50%;
    transform: translateY(-50%);
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    border-radius: 9px;
    background: transparent;
    color: var(--muted, #b9b6ad);
    cursor: pointer;
    padding: 0;
    transition: .2s;
}
.password-toggle:hover { background: rgba(212,175,55,.14); color: var(--gold-soft, #f4e5a1); }
.password-toggle svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.password-toggle .off { display: none; }
.password-toggle.shown .on { display: none; }
.password-toggle.shown .off { display: block; }

</style>
</head>

<body>
<div class="bg-grid"></div>

<a href="index.html" class="back-button">← الرجوع للموقع</a>

<div class="auth-wrap">
  <div class="auth-card">

    <h1>إنشاء حساب</h1>
    <p class="subtitle">أنشئ حسابك في Deutsch Einfach وابدأ التحضير لـ TELC B1 &amp; B2</p>

    <form id="signup-form">

      <label for="name">الاسم الكامل</label>
      <input type="text" id="name" placeholder="دخل الاسم ديالك" required>

      <label for="email">البريد الإلكتروني</label>
      <input type="email" id="email" placeholder="example@gmail.com" required>

      <label for="password">كلمة المرور</label>
      <div class="password-wrap">
        <input type="password" id="password" placeholder="دخل كلمة المرور" minlength="6" required>
        <button type="button" class="password-toggle" aria-label="إظهار كلمة المرور"><svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg><svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg></button>
      </div>

      <label for="confirm-password">تأكيد كلمة المرور</label>
      <div class="password-wrap">
        <input type="password" id="confirm-password" placeholder="عاود دخل كلمة المرور" minlength="6" required>
        <button type="button" class="password-toggle" aria-label="إظهار كلمة المرور"><svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg><svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg></button>
      </div>

      <button type="submit" class="signup-submit" id="signup-button">إنشاء الحساب</button>

    </form>

    <p class="login-text">
      عندك حساب من قبل؟
      <a href="login.html">تسجيل الدخول</a>
    </p>

  </div>
</div>

<script type="module">

    // =========================
    // FIREBASE
    // =========================

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


    import {
        getAuth,
        createUserWithEmailAndPassword,
        updateProfile,
        setPersistence,
        browserLocalPersistence
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


    import {
        getFirestore,
        doc,
        setDoc,
        serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


    // =========================
    // CONFIG
    // =========================

    const firebaseConfig = {

        apiKey: "AIzaSyDHMmaHLYRRHfdRDj-hf7s5LOqeWPTiOxU",

        authDomain: "deutsch-einfach-4c81f.firebaseapp.com",

        projectId: "deutsch-einfach-4c81f",

        storageBucket: "deutsch-einfach-4c81f.firebasestorage.app",

        messagingSenderId: "152448766933",

        appId: "1:152448766933:web:f7824c4db8ab3caccbe35c",

        measurementId: "G-9QV234Z0KZ"

    };


    // =========================
    // INIT
    // =========================

    const app =
        initializeApp(firebaseConfig);


    const auth =
        getAuth(app);


    const db =
        getFirestore(app);


    console.log("Firebase OK ✅");


    // =========================
    // PERSISTENCE
    // =========================

    try {

        await setPersistence(
            auth,
            browserLocalPersistence
        );

        console.log(
            "Persistence OK ✅"
        );

    }

    catch (error) {

        console.warn(
            "Persistence problem:",
            error
        );

        /*
        ما نوقفوش التسجيل.
        الحساب يقدر يتخلق عادي.
        */

    }


    // =========================
    // FORM
    // =========================

    const form =
        document.getElementById(
            "signup-form"
        );


    const button =
        document.getElementById(
            "signup-button"
        );


    // =========================
    // SIGNUP
    // =========================

    form.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const name =
                document
                    .getElementById("name")
                    .value
                    .trim();


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim()
                    .toLowerCase();


            const password =
                document
                    .getElementById("password")
                    .value;


            const confirmPassword =
                document
                    .getElementById("confirm-password")
                    .value;


            // =========================
            // CHECK
            // =========================

            if (name.length < 2) {

                alert(
                    "دخل الاسم الكامل ديالك ❌"
                );

                return;
            }


            if (password.length < 6) {

                alert(
                    "كلمة المرور خاصها تكون على الأقل 6 حروف ❌"
                );

                return;
            }


            if (password !== confirmPassword) {

                alert(
                    "كلمتا المرور غير متطابقتين ❌"
                );

                return;
            }


            button.disabled = true;

            button.textContent =
                "جاري إنشاء الحساب...";


            try {

                // =========================
                // CREATE AUTH ACCOUNT
                // =========================

                console.log(
                    "Creating account..."
                );


                const result =
                    await createUserWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                const user =
                    result.user;


                console.log(
                    "ACCOUNT CREATED ✅",
                    user.uid
                );


                // =========================
                // NAME
                // =========================

                try {

                    await updateProfile(
                        user,
                        {
                            displayName: name
                        }
                    );

                }

                catch (error) {

                    console.warn(
                        "Name error:",
                        error
                    );

                }


                // =========================
                // FIRESTORE
                // =========================

                /* نفس الحكاية ديال login.html: crypto.randomUUID
                   ماكايناش ف Safari القديم، وlocalStorage كيرمي
                   استثناء ف التصفح الخاص. */
                var newSessionId;
                try {
                    newSessionId =
                        (typeof crypto !== "undefined" &&
                         typeof crypto.randomUUID === "function")
                            ? crypto.randomUUID()
                            : "id-" + Date.now().toString(36) + "-" +
                              Math.random().toString(36).slice(2, 10) +
                              Math.random().toString(36).slice(2, 10);
                }
                catch (idError) {
                    newSessionId =
                        "id-" + Date.now().toString(36) + "-" +
                        Math.random().toString(36).slice(2, 10);
                }

                try {
                    localStorage.setItem(
                        "deutschEinfachSessionId",
                        newSessionId
                    );
                }
                catch (storageError) {
                    /* التصفح الخاص: الحارس غادي يتخطى، ماشي مشكل */
                }

                try {

                    await setDoc(
                        doc(
                            db,
                            "users",
                            user.uid
                        ),
                        {

                            name: name,

                            email: email,

                            plan: "free",

                            subscriptionActive: false,

                            subscriptionStart: null,

                            subscriptionEnd: null,

                            createdAt:
                                serverTimestamp(),

                            /* الحساب الجديد كيولي هو الجلسة النشيطة.
                               بلا هادشي، المسجل الجديد كيبقى بلا
                               sessionId والحارس ماعندو باش يقارن. */
                            sessionId:
                                newSessionId,

                            sessionUpdatedAt:
                                new Date()

                        }
                    );


                    console.log(
                        "FIRESTORE CREATED ✅"
                    );

                }

                catch (firestoreError) {

                    console.warn(
                        "Firestore failed:",
                        firestoreError
                    );

                    /*
                    حتى إلا Firestore فشل،
                    Auth راه خدام والحساب تخلق.
                    ما نوقفوش المستخدم.
                    */

                }


                // =========================
                // SUCCESS
                // =========================

                console.log(
                    "REGISTRATION SUCCESS ✅"
                );


                button.textContent =
                    "تم إنشاء الحساب ✅";


                /*
                ما غاديش نخلي alert يوقف
                الانتقال للصفحة.
                */

                window.location.href =
                    "dashboard.html";

            }


            catch (error) {

                console.error(
                    "SIGNUP ERROR:",
                    error
                );


                button.disabled = false;

                button.textContent =
                    "إنشاء الحساب";


                if (
                    error.code ===
                    "auth/email-already-in-use"
                ) {

                    alert(
                        "هاد الإيميل مسجل من قبل ❌\n\n" +
                        "دخل من صفحة تسجيل الدخول."
                    );

                }

                else if (
                    error.code ===
                    "auth/invalid-email"
                ) {

                    alert(
                        "الإيميل غير صحيح ❌"
                    );

                }

                else if (
                    error.code ===
                    "auth/weak-password"
                ) {

                    alert(
                        "كلمة المرور ضعيفة ❌"
                    );

                }

                else if (
                    error.code ===
                    "auth/network-request-failed"
                ) {

                    alert(
                        "كاين مشكل فالإنترنت أو الاتصال بـ Firebase ❌"
                    );

                }

                else {

                    alert(
                        "وقع مشكل فالتسجيل ❌\n\n" +
                        "CODE: " +
                        (
                            error.code ||
                            "unknown"
                        ) +
                        "\n\n" +
                        (
                            error.message ||
                            "Unknown error"
                        )
                    );

                }

            }

        }
    );

</script>


<script>
/* عين إظهار كلمة المرور.

   كنبدلو type غير ديال الخانة اللي حدا الزر — بلا هادشي
   الضغطة كانت تبين جميع كلمات السر فالصفحة. */
document.querySelectorAll(".password-toggle").forEach(function (button) {

  button.addEventListener("click", function () {

    var input = button.parentElement.querySelector("input");

    if (!input) return;

    var hidden = input.type === "password";

    input.type = hidden ? "text" : "password";

    button.classList.toggle("shown", hidden);

    button.setAttribute(
      "aria-label",
      hidden ? "إخفاء كلمة المرور" : "إظهار كلمة المرور"
    );

    /* المؤشر كيرجع للآخر ملي يتبدل النوع — كنرجعوه */
    var end = input.value.length;
    input.focus();
    try { input.setSelectionRange(end, end); } catch (e) {}

  });

});
</script>

</body>
</html>
