<script type="module">

/* =====================================================
   FIREBASE IMPORTS
   ===================================================== */

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
getAuth,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
getFirestore,
doc,
getDoc,
getDocs,
setDoc,
updateDoc,
deleteDoc,
addDoc,
collection,
query,
where,
orderBy,
onSnapshot,
serverTimestamp,
runTransaction
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
   ===================================================== */

const firebaseConfig={

apiKey:"AIzaSyDHMmaHLYRRHfdRDj-hf7s5LOqeWPTiOxU",

authDomain:
"deutsch-einfach-4c81f.firebaseapp.com",

projectId:
"deutsch-einfach-4c81f",

storageBucket:
"deutsch-einfach-4c81f.firebasestorage.app",

messagingSenderId:
"152448766933",

appId:
"1:152448766933:web:f7824c4db8ab3caccbe35c",

measurementId:
"G-9QV234Z0KZ"

};


const app=initializeApp(firebaseConfig);

const auth=getAuth(app);

const db=getFirestore(app);


/* =====================================================
   LIMITS
   ===================================================== */

const MAX_FRIENDS=100;

/* Group maximum = 8 */

const MAX_GROUP_MEMBERS=8;


/* =====================================================
   STATE
   ===================================================== */

let currentUser=null;
let currentUserData=null;

let currentMode="community";

let currentPrivateChatId=null;
let currentPrivateUserId=null;

let currentGroupId=null;
let currentGroupData=null;

let currentProfileId=null;

let unsubscribeMessages=null;
let unsubscribeFriends=null;
let unsubscribeGroups=null;

let friendsCache=[];
let groupsCache=[];


/* =====================================================
   HELPERS
   ===================================================== */

function escapeHtml(v){

if(v===undefined||v===null)
return "";

return String(v)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function getUserName(d){

return d?.displayName
||d?.name
||d?.username
||"User";

}


function getInitial(d){

return getUserName(d)
.charAt(0)
.toUpperCase();

}


function showToast(text){

const t=document.getElementById("toast");

t.textContent=text;

t.classList.remove("show");

void t.offsetWidth;

t.classList.add("show");

setTimeout(
()=>t.classList.remove("show"),
3000
);

}


function openModal(id){

document
.getElementById(id)
.classList.add("show");

}


function closeModal(id){

document
.getElementById(id)
.classList.remove("show");

}

window.closeModal=closeModal;


function formatTime(timestamp){

if(!timestamp)
return "";

try{

return timestamp
.toDate()
.toLocaleTimeString(
"de-DE",
{
hour:"2-digit",
minute:"2-digit"
}
);

}catch{

return "";

}

}


/* =====================================================
   AUTH
   ===================================================== */

onAuthStateChanged(
auth,
async user=>{

if(!user){

location.href="login.html";

return;

}

currentUser=user;

await loadCurrentUser();

startFriendsListener();

startGroupsListener();

startRequestsListener();

openCommunity();

}
);


async function loadCurrentUser(){

const ref=
doc(
db,
"users",
currentUser.uid
);

const snap=
await getDoc(ref);


if(snap.exists()){

currentUserData=snap.data();

}else{

currentUserData={

displayName:
currentUser.displayName
||
currentUser.email?.split("@")[0]
||
"User",

createdAt:
serverTimestamp()

};

await setDoc(
ref,
currentUserData
);

}

}


/* =====================================================
   SIDEBAR
   ===================================================== */

window.toggleSidebar=()=>{

document
.getElementById("sidebar")
.classList.toggle("open");

};


function closeMobileSidebar(){

document
.getElementById("sidebar")
.classList.remove("open");

}


/* =====================================================
   COMMUNITY
   ===================================================== */

window.openCommunity=()=>{

currentMode="community";

currentPrivateChatId=null;
currentPrivateUserId=null;

currentGroupId=null;
currentGroupData=null;


document
.getElementById("headerName")
.textContent="Community";


document
.getElementById("headerSub")
.textContent=
"Deutsch Einfach Community";


document
.getElementById("headerAvatar")
.innerHTML="💬";


document
.getElementById("headerAction")
.style.display="none";


listenMessages(

query(

collection(
db,
"chatMessages"
),

orderBy(
"createdAt",
"asc"
)

)

);


closeMobileSidebar();

};


/* =====================================================
   MESSAGE LISTENER
   ===================================================== */

function listenMessages(q){

if(unsubscribeMessages)
unsubscribeMessages();


unsubscribeMessages=
onSnapshot(

q,

snapshot=>{

const messages=[];

snapshot.forEach(d=>{

messages.push({
id:d.id,
...d.data()
});

});

renderMessages(messages);

},

error=>{

console.error(error);

showToast(
"Nachrichten konnten nicht geladen werden."
);

}

);

}


/* =====================================================
   RENDER MESSAGES
   ===================================================== */

async function renderMessages(messages){

const container=
document.getElementById("messages");


if(!messages.length){

container.innerHTML=`

<div class="empty">

<div>

<h2>
Noch keine Nachrichten
</h2>

<p>
Schreib die erste Nachricht 👋
</p>

</div>

</div>

`;

return;

}


const html=[];


for(const message of messages){

let user={};


try{

const snap=
await getDoc(
doc(
db,
"users",
message.userId
)
);

if(snap.exists())
user=snap.data();

}catch{}


const name=
message.userName
||
getUserName(user);


const avatar=
user.photoURL||"";


const initial=
getInitial(user);


const mine=
message.userId===currentUser.uid;


html.push(`

<div class="message ${mine?"mine":""}">

<div
class="message-avatar"
onclick="openUserProfile('${escapeHtml(message.userId)}')">

${
avatar
?
`<img src="${escapeHtml(avatar)}">`
:
escapeHtml(initial)
}

</div>


<div class="message-content">

<div
class="message-name"
onclick="openUserProfile('${escapeHtml(message.userId)}')">

${escapeHtml(name)}

</div>


<div class="message-text">

${escapeHtml(message.text)}

</div>


<div class="message-time">

${formatTime(message.createdAt)}

</div>

</div>

</div>

`);

}


container.innerHTML=
html.join("");

container.scrollTop=
container.scrollHeight;

}


/* =====================================================
   SEND MESSAGE
   ===================================================== */

window.sendMessage=async()=>{

const input=
document.getElementById("messageInput");

const text=
input.value.trim();


if(!text)
return;


if(text.length>500){

showToast(
"Maximal 500 Zeichen."
);

return;

}


try{

const data={

userId:
currentUser.uid,

userName:
getUserName(currentUserData),

text,

createdAt:
serverTimestamp()

};


/* ================= COMMUNITY ================= */

if(currentMode==="community"){

await addDoc(
collection(
db,
"chatMessages"
),
data
);

}


/* ================= PRIVATE ================= */

else if(currentMode==="private"){

if(
!currentPrivateChatId
||
!currentPrivateUserId
){

showToast(
"Privater Chat ist nicht verfügbar."
);

return;

}


if(
!friendsCache.some(
f=>f.uid===currentPrivateUserId
)
){

showToast(
"Nur Freunde können miteinander chatten."
);

return;

}


/*
   IMPORTANT:
   Direct setDoc with merge.
   No getDoc before creation.
*/

await setDoc(

doc(
db,
"privateChats",
currentPrivateChatId
),

{
participants:[
currentUser.uid,
currentPrivateUserId
].sort(),

updatedAt:
serverTimestamp()

},

{
merge:true
}

);


await addDoc(

collection(
db,
"privateChats",
currentPrivateChatId,
"messages"
),

data

);

}


/* ================= GROUP ================= */

/* =====================================================
   REMOVE GROUP MEMBER
   ONLY OWNER CAN REMOVE MEMBERS
   OWNER CANNOT REMOVE HIMSELF
   ===================================================== */

window.removeGroupMember = async function(uid) {

  if (!currentGroupId || !currentUser) {
    return;
  }

  /* OWNER CANNOT REMOVE HIMSELF */
  if (uid === currentUser.uid) {

    showToast(
      "👑 Der Owner kann sich nicht selbst entfernen."
    );

    return;
  }

  try {

    const ref = doc(
      db,
      "groups",
      currentGroupId
    );

    await runTransaction(
      db,
      async function(transaction) {

        const snap = await transaction.get(ref);

        if (!snap.exists()) {
          throw new Error("notfound");
        }

        const group = snap.data();

        /* ONLY OWNER */
        if (group.ownerId !== currentUser.uid) {
          throw new Error("owner");
        }

        /* CLOSED GROUP */
        if (group.closed) {
          throw new Error("closed");
        }

        /* OWNER CANNOT BE REMOVED */
        if (uid === group.ownerId) {
          throw new Error("ownerremove");
        }

        /* USER MUST BE MEMBER */
        if (!group.members || !group.members.includes(uid)) {
          throw new Error("nomember");
        }

        const members = group.members.filter(
          function(memberUid) {
            return memberUid !== uid;
          }
        );

        transaction.update(
          ref,
          {
            members: members,
            memberCount: members.length
          }
        );

      }
    );

    showToast(
      "✅ Mitglied wurde entfernt."
    );

    await openGroupSettings();

  } catch (error) {

    console.error(
      "REMOVE MEMBER ERROR:",
      error
    );

    if (error.message === "owner") {

      showToast(
        "❌ Nur der Owner kann Mitglieder entfernen."
      );

    } else if (error.message === "ownerremove") {

      showToast(
        "❌ Der Owner kann nicht entfernt werden."
      );

    } else if (error.message === "closed") {

      showToast(
        "🔒 Die Gruppe ist geschlossen."
      );

    } else if (error.message === "nomember") {

      showToast(
        "❌ Dieser Benutzer ist kein Mitglied der Gruppe."
      );

    } else {

      showToast(
        "❌ Mitglied konnte nicht entfernt werden."
      );

    }

  }

};


/* =====================================================
   LEAVE GROUP
   NORMAL MEMBER CAN LEAVE
   OWNER CANNOT LEAVE
   ===================================================== */

window.leaveGroup = async function() {

  if (!currentGroupId || !currentUser) {
    return;
  }

  /* OWNER CANNOT LEAVE */
  if (
    currentGroupData &&
    currentGroupData.ownerId === currentUser.uid
  ) {

    showToast(
      "👑 Der Owner kann die Gruppe nicht verlassen. Schließe die Gruppe stattdessen."
    );

    return;
  }

  const ok = confirm(
    "Willst du diese Gruppe wirklich verlassen?"
  );

  if (!ok) {
    return;
  }

  try {

    const ref = doc(
      db,
      "groups",
      currentGroupId
    );

    await runTransaction(
      db,
      async function(transaction) {

        const snap = await transaction.get(ref);

        if (!snap.exists()) {
          throw new Error("notfound");
        }

        const group = snap.data();

        /* GROUP CLOSED */
        if (group.closed) {
          throw new Error("closed");
        }

        /* USER MUST BE MEMBER */
        if (
          !group.members ||
          !group.members.includes(currentUser.uid)
        ) {
          throw new Error("notmember");
        }

        /* OWNER PROTECTION */
        if (group.ownerId === currentUser.uid) {
          throw new Error("owner_cannot_leave");
        }

        /* REMOVE CURRENT USER */
        const newMembers = group.members.filter(
          function(memberUid) {
            return memberUid !== currentUser.uid;
          }
        );

        if (newMembers.length < 1) {
          throw new Error("invalid_group");
        }

        transaction.update(
          ref,
          {
            members: newMembers,
            memberCount: newMembers.length
          }
        );

      }
    );

    closeModal(
      "groupSettingsModal"
    );

    currentGroupId = null;
    currentGroupData = null;

    showToast(
      "🚪 Du hast die Gruppe verlassen."
    );

    openCommunity();

  } catch (error) {

    console.error(
      "LEAVE GROUP ERROR:",
      error
    );

    if (error.message === "owner_cannot_leave") {

      showToast(
        "👑 Der Owner kann die Gruppe nicht verlassen. Du kannst die Gruppe schließen."
      );

    } else if (error.message === "closed") {

      showToast(
        "🔒 Die Gruppe ist geschlossen."
      );

    } else if (error.message === "notmember") {

      showToast(
        "❌ Du bist kein Mitglied dieser Gruppe."
      );

    } else {

      showToast(
        "❌ Gruppe konnte nicht verlassen werden."
      );

    }

  }

};

window.sendFriendRequest=async uid=>{

if(
!uid
||
uid===currentUser.uid
)
return;


try{

const count=
await getFriendCount(
currentUser.uid
);


if(count>=MAX_FRIENDS){

showToast(
"🚫 Du hast bereits 100 Freunde."
);

return;

}


const target=
await getFriendCount(uid);


if(target>=MAX_FRIENDS){

showToast(
"🚫 Dieser Benutzer hat bereits 100 Freunde."
);

return;

}


const id=
[
currentUser.uid,
uid
]
.sort()
.join("_");


const friendship=
await getDoc(

doc(
db,
"friendships",
id
)

);


if(friendship.exists()){

showToast(
"Ihr seid bereits Freunde."
);

return;

}


const requestId=
currentUser.uid+"_"+uid;


const ref=
doc(
db,
"friendRequests",
requestId
);

await getDoc(ref);


if(
old.exists()
&&
old.data().status==="pending"
){

showToast(
"📨 Anfrage wurde bereits gesendet."
);

return;

}


await setDoc(

ref,

{
fromUid:
currentUser.uid,

toUid:uid,

status:"pending",

createdAt:
serverTimestamp()

}

);


showToast(
"🎉 Freundschaftsanfrage gesendet!"
);


closeModal(
"profileModal"
);


}catch(error){

console.error(
"SEND FRIEND REQUEST ERROR:",
error
);

showToast(
"❌ Anfrage konnte nicht gesendet werden."
);

}

};

/* =====================================================
   ACCEPT FRIEND REQUEST
   ===================================================== */

window.acceptFriendRequest = async function(requestId, fromUid) {

  try {

    const requestRef = doc(
      db,
      "friendRequests",
      requestId
    );

    const friendshipId = [
      currentUser.uid,
      fromUid
    ]
      .sort()
      .join("_");

    const friendshipRef = doc(
      db,
      "friendships",
      friendshipId
    );

    /* CHECK MY FRIEND LIMIT */
    const myCount = await getFriendCount(
      currentUser.uid
    );

    /* CHECK OTHER USER FRIEND LIMIT */
    const theirCount = await getFriendCount(
      fromUid
    );

    if (myCount >= MAX_FRIENDS) {

      showToast(
        "🚫 Du hast bereits 100 Freunde."
      );

      return;
    }

    if (theirCount >= MAX_FRIENDS) {

      showToast(
        "🚫 Dieser User hat bereits 100 Freunde."
      );

      return;
    }

    await runTransaction(
      db,
      async function(transaction) {

        const req = await transaction.get(
          requestRef
        );

        const friendship = await transaction.get(
          friendshipRef
        );

        /* REQUEST DOES NOT EXIST */
        if (!req.exists()) {
          throw new Error("request");
        }

        /* ALREADY FRIENDS */
        if (friendship.exists()) {
          throw new Error("already");
        }

        const data = req.data();

        /* CHECK REQUEST */
        if (
          data.toUid !== currentUser.uid ||
          data.status !== "pending"
        ) {
          throw new Error("invalid");
        }

        /* CREATE FRIENDSHIP */
        transaction.set(
          friendshipRef,
          {
            users: [
              currentUser.uid,
              fromUid
            ].sort(),

            createdAt: serverTimestamp()
          }
        );

        /* ACCEPT REQUEST */
        transaction.update(
          requestRef,
          {
            status: "accepted",
            respondedAt: serverTimestamp()
          }
        );

      }
    );

    showToast(
      "🎉 Freundschaft angenommen!"
    );

    await openRequests();

  } catch (error) {

    console.error(
      "ACCEPT FRIEND ERROR:",
      error
    );

    if (error.message === "already") {

      showToast(
        "Ihr seid bereits Freunde."
      );

    } else if (error.message === "request") {

      showToast(
        "❌ Freundschaftsanfrage wurde nicht gefunden."
      );

    } else if (error.message === "invalid") {

      showToast(
        "❌ Diese Anfrage ist nicht mehr gültig."
      );

    } else {

      showToast(
        "❌ Freundschaft konnte nicht angenommen werden."
      );

    }

  }

};
