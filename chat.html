<!DOCTYPE html>
<html lang="de" dir="ltr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Community – Deutsch Einfach</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{

    --sidebar:#141414;
    --sidebar-hover:#232323;
    --accent:#d60000;
    --accent-dark:#a80000;
    --gold:#ffd500;
    --bg:#f4f4f5;
    --surface:#ffffff;
    --border:#e7e7ea;
    --text:#17181a;
    --text-muted:#7c7c82;
    --bubble-mine:#1f2023;

}

*{
    box-sizing:border-box
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
}

body{
    font-family:"Inter",Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
}

svg.icon{
    width:18px;
    height:18px;
    stroke:currentColor;
    fill:none;
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
    flex-shrink:0;
    display:block;
}

button,
input,
textarea{
    font-family:inherit;
}

button{
    cursor:pointer;
}

button:disabled{
    cursor:not-allowed;
    opacity:.7;
}

/* =====================================================
   APP
   ===================================================== */

.app{
    display:flex;
    width:100%;
    height:100vh;
    overflow:hidden;
}

/* =====================================================
   SIDEBAR
   ===================================================== */

.sidebar{
    width:330px;
    min-width:330px;
    background:var(--sidebar);
    color:white;
    display:flex;
    flex-direction:column;
    border-right:1px solid #333;
    position:relative;
    z-index:100;
}

.logo-area{
    padding:18px;
    display:flex;
    align-items:center;
    gap:12px;
    border-bottom:1px solid #333;
    flex-shrink:0;
}

.logo{
    width:44px;
    height:44px;
    border-radius:14px;
    object-fit:cover;
    background:var(--accent);
}

.logo-text{
    font-size:18px;
    font-weight:700;
    letter-spacing:-.2px;
}

.logo-sub{
    font-size:11px;
    color:#8a8a8f;
    margin-top:1px;
}

.search-box{
    padding:14px;
    position:relative;
    flex-shrink:0;
}

.search-box input{
    width:100%;
    padding:12px 14px;
    border-radius:10px;
    border:1px solid transparent;
    outline:none;
    background:#222;
    color:white;
    transition:
        border .2s ease,
        box-shadow .2s ease,
        background .2s ease;
}

.search-box input:focus{
    border-color:#d60000;
    background:#1d1d1d;
    box-shadow:0 0 0 3px rgba(214,0,0,.12);
}

.search-box input::placeholder{
    color:#aaa;
}

/* =====================================================
   NAV
   ===================================================== */

.nav{
    padding:0 12px;
    flex-shrink:0;
}

.nav button{
    width:100%;
    border:none;
    background:transparent;
    color:#d8d8db;
    text-align:left;
    padding:11px 14px;
    border-radius:10px;
    margin-bottom:3px;
    font-size:14.5px;
    font-weight:500;
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:center;
    gap:11px;
    transition:
        transform .15s ease,
        background .2s ease,
        box-shadow .2s ease,
        color .2s ease;
}

.nav button svg.icon{
    width:19px;
    height:19px;
    opacity:.85;
}

.nav button .nav-label{
    flex:1;
}

.nav button:hover{
    background:var(--sidebar-hover);
    color:white;
}

.nav button.active{
    background:var(--accent);
    color:white;
    box-shadow:
        0 5px 15px rgba(214,0,0,.28);
}

.nav button.active svg.icon{
    opacity:1;
}

.nav button:active{
    transform:scale(.94);
}

.nav button::after{
    content:"";
    position:absolute;
    left:50%;
    top:50%;
    width:10px;
    height:10px;
    border-radius:50%;
    background:rgba(255,255,255,.35);
    transform:translate(-50%,-50%) scale(0);
    opacity:0;
    pointer-events:none;
}

.nav button.ripple::after{
    animation:navRipple .5s ease-out;
}

@keyframes navRipple{

    0%{
        transform:translate(-50%,-50%) scale(1);
        opacity:.8;
    }

    100%{
        transform:translate(-50%,-50%) scale(35);
        opacity:0;
    }

}

.badge{
    float:right;
    background:#ffd500;
    color:#111;
    min-width:22px;
    height:22px;
    padding:0 6px;
    border-radius:50px;
    text-align:center;
    line-height:22px;
    font-size:12px;
    font-weight:bold;
    box-shadow:0 2px 8px rgba(255,213,0,.25);
    animation:badgePop .25s ease;
}

@keyframes badgePop{

    from{
        transform:scale(.5);
        opacity:0;
    }

    to{
        transform:scale(1);
        opacity:1;
    }

}

/* =====================================================
   SECTIONS
   ===================================================== */

.section-title{
    padding:15px 16px 8px;
    color:#888;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.5px;
    flex-shrink:0;
}

.friend-list{
    overflow-y:auto;
    padding:0 10px;
    max-height:230px;
}

.group-list{
    overflow-y:auto;
    padding:0 10px;
    flex:1;
    min-height:80px;
}

/* =====================================================
   PERSON / GROUP
   ===================================================== */

.person,
.group-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px;
    border-radius:9px;
    cursor:pointer;
    transition:
        transform .15s ease,
        background .2s ease,
        box-shadow .2s ease;
    margin-bottom:2px;
}

.person:active,
.group-item:active{
    transform:scale(.96);
}

.person.active,
.group-item.active{
    background:#d60000 !important;
    color:white;
    box-shadow:0 4px 12px rgba(214,0,0,.2);
}

.person.active .person-email,
.group-item.active .person-email{
    color:#eee;
}

.person:hover,
.group-item:hover{
    background:#222;
}

.person.active:hover,
.group-item.active:hover{
    background:#d60000 !important;
}

.avatar{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#d60000;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-weight:bold;
    overflow:hidden;
    flex-shrink:0;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.person-info{
    min-width:0;
    flex:1;
}

.person-name{
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.person-email{
    color:#888;
    font-size:12px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin-top:2px;
}

.conversation-preview{
    color:#888;
    font-size:11px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin-top:3px;
}

.person.active .conversation-preview{
    color:#eee;
}

.conversation-time{
    color:#777;
    font-size:10px;
    flex-shrink:0;
    align-self:flex-start;
    margin-top:4px;
}

.person.active .conversation-time{
    color:#fff;
}

.create-group{
    margin:12px;
    padding:12px;
    background:var(--gold);
    color:#111;
    border:none;
    border-radius:10px;
    font-weight:700;
    font-size:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:
        transform .15s ease,
        box-shadow .2s ease;
    flex-shrink:0;
}

.create-group:hover{
    box-shadow:0 5px 15px rgba(255,213,0,.18);
    transform:translateY(-1px);
}

.create-group:active{
    transform:scale(.96);
}

/* =====================================================
   MAIN
   ===================================================== */

.main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
    background:#f5f5f5;
}

.chat-header{
    height:72px;
    min-height:72px;
    background:white;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    padding:0 20px;
    gap:12px;
    box-shadow:0 1px 5px rgba(0,0,0,.03);
    z-index:5;
}

.mobile-menu{
    display:none;
    border:none;
    background:#111;
    color:white;
    width:40px;
    height:40px;
    border-radius:8px;
}

.header-avatar{
    width:44px;
    height:44px;
    border-radius:50%;
    background:#d60000;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
    overflow:hidden;
    flex-shrink:0;
}

.header-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.header-info{
    flex:1;
    min-width:0;
}

.header-name{
    font-size:17px;
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.header-sub{
    font-size:12px;
    color:#777;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.header-btn{
    border:none;
    background:#111;
    color:white;
    padding:9px 13px;
    border-radius:8px;
    transition:
        transform .15s ease,
        background .2s ease;
}

.header-btn:hover{
    background:#222;
}

.header-btn:active{
    transform:scale(.94);
}

/* =====================================================
   MESSAGES
   ===================================================== */

.messages{
    flex:1;
    overflow-y:auto;
    padding:22px;
    scroll-behavior:smooth;
}

.messages.nav-page-effect{
    animation:pageSmooth .35s ease;
}

@keyframes pageSmooth{

    from{
        opacity:0;
        transform:translateY(10px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

.message{
    display:flex;
    gap:10px;
    margin-bottom:12px;
    max-width:800px;
    align-items:flex-end;
    animation:messageIn .2s ease;
}

@keyframes messageIn{

    from{
        opacity:0;
        transform:translateY(5px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

.message-content{
    background:white;
    border-radius:12px 12px 12px 4px;
    padding:10px 13px;
    box-shadow:0 1px 3px rgba(0,0,0,.08);
    max-width:min(600px,75%);
}

.message.mine{
    margin-left:auto;
    flex-direction:row-reverse;
}

.message.mine .message-content{
    background:var(--bubble-mine);
    color:white;
    border-radius:12px 12px 4px 12px;
}

.message-avatar{
    width:38px;
    height:38px;
    border-radius:50%;
    background:#d60000;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    cursor:pointer;
    overflow:hidden;
    transition:transform .15s ease;
}

.message-avatar:hover{
    transform:scale(1.05);
}

.message-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.message-name{
    font-size:12px;
    color:var(--accent);
    font-weight:700;
    cursor:pointer;
    margin-bottom:4px;
}

.message.mine .message-name{
    display:none;
}

.message-text{
    white-space:pre-wrap;
    word-break:break-word;
    line-height:1.45;
    font-size:14.5px;
}

.message-time{
    color:#999;
    font-size:10.5px;
    margin-top:5px;
    display:flex;
    align-items:center;
    gap:4px;
    justify-content:flex-end;
}

.message.mine .message-time{
    color:rgba(255,255,255,.7);
}

.message-time svg.icon{
    width:13px;
    height:13px;
    stroke-width:2.4;
}

/* =====================================================
   EMPTY
   ===================================================== */

.empty{
    height:100%;
    min-height:250px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#777;
}

.empty h2{
    color:#222;
    margin-bottom:8px;
}

.empty p{
    margin-top:0;
}

/* =====================================================
   INPUT
   ===================================================== */

.input-area{
    background:white;
    border-top:1px solid #ddd;
    padding:14px;
    display:flex;
    gap:10px;
    box-shadow:0 -2px 8px rgba(0,0,0,.03);
}

.input-area textarea{
    flex:1;
    resize:none;
    height:46px;
    border:1px solid #ccc;
    border-radius:10px;
    padding:12px;
    outline:none;
    transition:
        border .2s ease,
        box-shadow .2s ease;
}

.input-area textarea:focus{
    border-color:#d60000;
    box-shadow:0 0 0 3px rgba(214,0,0,.08);
}

.send-btn{
    width:96px;
    border:none;
    border-radius:10px;
    background:var(--accent);
    color:white;
    font-weight:700;
    font-size:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    transition:
        transform .15s ease,
        box-shadow .2s ease,
        background .2s ease;
}

.send-btn:hover{
    background:#b90000;
    box-shadow:0 5px 15px rgba(214,0,0,.2);
}

.send-btn:active{
    transform:scale(.94);
}

/* =====================================================
   MODALS
   ===================================================== */

.modal-bg{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:1000;
    padding:20px;
    backdrop-filter:blur(3px);
}

.modal-bg.show{
    display:flex;
    animation:modalBgIn .2s ease;
}

@keyframes modalBgIn{

    from{
        opacity:0;
    }

    to{
        opacity:1;
    }

}

.modal{
    width:100%;
    max-width:500px;
    max-height:90vh;
    overflow-y:auto;
    background:white;
    border-radius:15px;
    padding:22px;
    animation:modalIn .25s ease;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
}

@keyframes modalIn{

    from{
        opacity:0;
        transform:translateY(15px) scale(.97);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }

}

.modal h2{
    margin-top:0;
}

.modal input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:9px;
    margin-bottom:10px;
    outline:none;
}

.modal input:focus{
    border-color:#d60000;
}

.modal-btn{
    width:100%;
    padding:12px;
    border:none;
    border-radius:9px;
    margin-top:8px;
    background:#d60000;
    color:white;
    font-weight:bold;
    transition:transform .15s ease,box-shadow .2s ease;
}

.modal-btn:hover{
    box-shadow:0 5px 15px rgba(214,0,0,.16);
}

.modal-btn:active{
    transform:scale(.97);
}

.modal-btn.secondary{
    background:#222;
}

.modal-btn.yellow{
    background:#ffd500;
    color:#111;
}

.close-btn{
    float:right;
    border:none;
    background:#eee;
    width:32px;
    height:32px;
    border-radius:50%;
    transition:transform .15s ease,background .2s ease;
}

.close-btn:hover{
    background:#ddd;
    transform:rotate(90deg);
}

.profile-center{
    text-align:center;
}

.profile-avatar{
    width:90px;
    height:90px;
    border-radius:50%;
    margin:0 auto 15px;
    background:#d60000;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:32px;
    font-weight:bold;
    overflow:hidden;
}

.profile-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.profile-email-hidden{
    display:none!important;
}

/* =====================================================
   SEARCH
   ===================================================== */

.search-results{
    position:absolute;
    top:70px;
    left:14px;
    right:14px;
    background:white;
    color:#111;
    border-radius:10px;
    box-shadow:0 5px 20px rgba(0,0,0,.25);
    overflow:hidden;
    z-index:20;
    max-height:400px;
    overflow-y:auto;
}

.search-result{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px;
    cursor:pointer;
    transition:background .15s ease;
}

.search-result:hover{
    background:#f3f3f3;
}

/* =====================================================
   REQUESTS
   ===================================================== */

.request-card{
    border:1px solid #ddd;
    border-radius:10px;
    padding:13px;
    margin-bottom:10px;
    transition:
        box-shadow .2s ease,
        transform .15s ease;
}

.request-card:hover{
    box-shadow:0 5px 18px rgba(0,0,0,.06);
    transform:translateY(-1px);
}

.request-buttons{
    display:flex;
    gap:8px;
    margin-top:10px;
}

.request-buttons button{
    flex:1;
    padding:9px;
    border:none;
    border-radius:8px;
    font-weight:bold;
}

.accept{
    background:#19a463;
    color:white;
}

.reject{
    background:#eee;
    color:#111;
}

.danger{
    background:#d60000!important;
    color:white!important;
}

/* =====================================================
   GROUP
   ===================================================== */

.member{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 0;
    border-bottom:1px solid #eee;
}

.member-remove{
    border:none;
    background:#d60000;
    color:white;
    padding:7px 9px;
    border-radius:7px;
    font-size:12px;
    font-weight:bold;
}

.closed-banner{
    background:#eee;
    color:#555;
    padding:10px;
    border-radius:9px;
    margin:15px 0;
}

.friend-limit-box{
    background:#f5f5f5;
    border-radius:10px;
    padding:10px;
    margin-bottom:12px;
    font-size:13px;
    color:#555;
}

.friend-limit-box strong{
    color:#d60000;
}

/* =====================================================
   TOAST
   ===================================================== */

.toast{
    position:fixed;
    right:20px;
    bottom:20px;
    background:#111;
    color:white;
    padding:13px 18px;
    border-radius:10px;
    z-index:5000;
    display:none;
    box-shadow:0 8px 25px rgba(0,0,0,.25);
    animation:toastIn .25s ease;
}

.toast.show{
    display:block;
}

@keyframes toastIn{

    from{
        opacity:0;
        transform:translateY(10px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

/* =====================================================
   SCROLLBAR
   ===================================================== */

.friend-list::-webkit-scrollbar,
.group-list::-webkit-scrollbar,
.messages::-webkit-scrollbar,
.modal::-webkit-scrollbar,
.search-results::-webkit-scrollbar{
    width:6px;
}

.friend-list::-webkit-scrollbar-thumb,
.group-list::-webkit-scrollbar-thumb,
.messages::-webkit-scrollbar-thumb,
.modal::-webkit-scrollbar-thumb,
.search-results::-webkit-scrollbar-thumb{
    background:#777;
    border-radius:10px;
}

/* =====================================================
   MOBILE
   ===================================================== */

@media(max-width:750px){

    .sidebar{
        position:fixed;
        left:-340px;
        top:0;
        bottom:0;
        z-index:2000;
        transition:left .25s ease;
        box-shadow:10px 0 30px rgba(0,0,0,.25);
    }

    .sidebar.open{
        left:0;
    }

    .mobile-menu{
        display:block;
    }

    .chat-header{
        padding:0 10px;
    }

    .messages{
        padding:14px;
    }

    .message-content{
        max-width:75%;
    }

    .input-area{
        padding:10px;
    }

    .send-btn{
        width:70px;
    }

    .modal-bg{
        padding:10px;
    }

    .modal{
        max-height:94vh;
        padding:18px;
    }

}

@media(max-width:420px){

    .logo-text{
        font-size:17px;
    }

    .header-name{
        font-size:15px;
    }

    .header-sub{
        font-size:11px;
    }

    .message-avatar{
        width:32px;
        height:32px;
    }

    .message-content{
        max-width:82%;
    }

}

</style>

</head>

<body>

<div class="app">

<aside class="sidebar" id="sidebar">

<div class="logo-area">

<img
src="icon1.png"
class="logo"
onerror="this.style.display='none'"
>

<div>

<div class="logo-text">
Deutsch Einfach 🇩🇪
</div>

<div class="logo-sub">
Community
</div>

</div>

</div>

<div class="search-box">

<input
id="searchInput"
type="text"
placeholder="Person suchen..."
autocomplete="off"
>

<div
id="searchResults"
class="search-results"
style="display:none">
</div>

</div>

<div class="nav">

<button onclick="location.href='index.html'">
<svg class="icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
<span class="nav-label">Zurück</span>
</button>

<button
id="communityBtn"

<script type="module">

/* =====================================================

from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

/* =====================================================
   FIREBASE CONFIG
   ===================================================== */

const firebaseConfig={

apiKey:"AIzaSyDHMmaHLYRRHfdRDj-hf7s5LOqeWPTiOxU",

authDomain:

measurementId:

const app=initializeApp(firebaseConfig);

/* =====================================================

/* =====================================================

let currentUser=null;

let conversationsCache=[];

let conversationsDocsCache=[];

let messagesViewId=0;

/* =====================================================
   HELPERS
   ===================================================== */

function escapeHtml(v){

if(v===undefined||v===null)
return "";

return String(v)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function getUserName(d){

return d?.displayName
||d?.name
||d?.username
||"User";

}

function getInitial(d){

return getUserName(d)
.charAt(0)
.toUpperCase();

}

/*
   Deterministic avatar color per user, so people
   are visually distinguishable at a glance (like
   Slack/Discord) instead of every initial-avatar
   being the same flat red.
*/

const AVATAR_PALETTE=[

"#d60000",
"#b02a91",
"#7a4fd6",
"#2f6fd6",
"#0a8f6b",
"#c77b00",
"#3a3f47"

];

const GROUP_ICON_SVG=
'<svg class="icon" viewBox="0 0 24 24" style="width:20px;height:20px"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>';

function getAvatarColor(uid){

if(!uid)
return AVATAR_PALETTE[0];

let hash=0;

for(let i=0;i<uid.length;i++){

hash=
(hash*31+uid.charCodeAt(i))
&0xffffffff;

}

return AVATAR_PALETTE[
Math.abs(hash)%AVATAR_PALETTE.length
];

}

function showToast(text){

const t=
document.getElementById("toast");

t.textContent=text;

t.classList.remove("show");

void t.offsetWidth;

t.classList.add("show");

clearTimeout(
window.__toastTimer
);

window.__toastTimer=
setTimeout(
()=>t.classList.remove("show"),
3000
);

}

function openModal(id){

document
.getElementById(id)
.classList.add("show");

}

function closeModal(id){

document
.getElementById(id)
.classList.remove("show");

}

window.closeModal=closeModal;

function formatTime(timestamp){

if(!timestamp)
return "";

try{

return timestamp
.toDate()
.toLocaleTimeString(
"de-DE",
{
hour:"2-digit",
minute:"2-digit"
}
);

}catch{

return "";

}

}

function formatConversationTime(timestamp){

if(!timestamp)
return "";

try{

const date=timestamp.toDate();

const now=new Date();

const sameDay=
date.toDateString()===
now.toDateString();

if(sameDay){

return date.toLocaleTimeString(
"de-DE",
{
hour:"2-digit",
minute:"2-digit"
}
);

}

return date.toLocaleDateString(
"de-DE",
{
day:"2-digit",
month:"2-digit"
}
);

}catch{

return "";

}

}

function getLastMessagePreview(conversation){

const text=
conversation?.lastMessage;

if(!text)
return "Privater Chat";

return text.length>35
?
text.substring(0,35)+"…"
:
text;

}

/* =====================================================
   STOP MESSAGE LISTENER
   ===================================================== */

function stopMessagesListener(){

messagesViewId++;

if(unsubscribeMessages){

unsubscribeMessages();

unsubscribeMessages=null;

}

}

/* =====================================================
   AUTH
   ===================================================== */

onAuthStateChanged(
auth,
async user=>{

if(!user){

location.href="login.html";

return;

}

currentUser=user;

await loadCurrentUser();

startFriendsListener();

startGroupsListener();

startRequestsListener();

startConversationsListener();

openCommunity();

}
);

async function loadCurrentUser(){

const ref=
doc(
db,
"users",
currentUser.uid
);

const snap=
await getDoc(ref);

if(snap.exists()){

currentUserData=snap.data();

}else{

currentUserData={

displayName:
currentUser.displayName
||
currentUser.email?.split("@")[0]
||
"User",

createdAt:
serverTimestamp()

};

await setDoc(
ref,
currentUserData
);

}

}

/* =====================================================
   SIDEBAR
   ===================================================== */

window.toggleSidebar=()=>{

document
.getElementById("sidebar")
.classList.toggle("open");

};

function closeMobileSidebar(){

document
.getElementById("sidebar")
.classList.remove("open");

}

function setActiveNav(buttonId){

document
.querySelectorAll(".nav button")
.forEach(button=>{

button.classList.remove("active");

});

if(!buttonId)
return;

const button=
document.getElementById(buttonId);

if(button){

button.classList.add("active");

}

}

/* =====================================================
   ACTIVE ITEM
   ===================================================== */

function setActiveItem(element){

document
.querySelectorAll(".person, .group-item")
.forEach(item=>{

item.classList.remove("active");

});

if(element){

element.classList.add("active");

}

}

window.setActiveItem=setActiveItem;

/* =====================================================
   COMMUNITY
   ===================================================== */

window.openCommunity=()=>{

currentMode="community";

currentPrivateChatId=null;

currentPrivateUserId=null;

currentGroupId=null;

currentGroupData=null;

document
.getElementById("headerName")
.textContent="Community";

document
.getElementById("headerSub")
.textContent=
"Deutsch Einfach Community";

{

const ha=
document.getElementById(
"headerAvatar"
);

ha.style.background=
"var(--accent)";

ha.innerHTML=
'<svg class="icon" viewBox="0 0 24 24" style="width:22px;height:22px"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>';

}

document
.getElementById("headerAction")
.style.display="none";

document
.getElementById("messageInput")
.disabled=false;

listenMessages(
query(
collection(
db,
"chatMessages"
),
orderBy(
"createdAt",
"asc"
)
)
);

closeMobileSidebar();

setActiveNav("communityBtn");

renderConversations(conversationsCache);

};

/* =====================================================
   MESSAGE LISTENER
   ===================================================== */

function listenMessages(q){

stopMessagesListener();

const thisViewId=
messagesViewId;

unsubscribeMessages=
onSnapshot(
q,
snapshot=>{

const messages=[];

snapshot.forEach(d=>{

messages.push({

id:d.id,
...d.data()

});

});

renderMessages(
messages,
thisViewId
);

},
error=>{

console.error(
"MESSAGES LISTENER ERROR:",
error
);

if(thisViewId!==messagesViewId)
return;

showToast(
"Nachrichten konnten nicht geladen werden."
);

}
);

}

/* =====================================================
   RENDER MESSAGES
   ===================================================== */

async function renderMessages(
messages,
viewId
){

if(viewId!==messagesViewId)
return;

const container=
document.getElementById("messages");

/*
   IMPORTANT:
   Empty private/group chat is valid.
*/

if(!messages.length){

container.innerHTML=`

<div class="empty">

<div>

<h2>
Noch keine Nachrichten
</h2>

<p>
Schreib die erste Nachricht 👋
</p>

</div>

</div>

`;

return;

}

/*
   IMPORTANT:
   Build all messages first.

   We use Promise.all so one slow user lookup
   cannot make the chat appear empty.
*/

const html=
await Promise.all(
messages.map(
async message=>{

if(viewId!==messagesViewId)
return "";

let user={};

try{

const snap=
await getDoc(
doc(
db,
"users",
message.userId
)
);

if(snap.exists()){

user=snap.data();

}

}catch(error){

console.error(
"USER MESSAGE LOAD ERROR:",
error
);

}

if(viewId!==messagesViewId)
return "";

const name=
message.userName
||
getUserName(user);

const avatar=
user.photoURL||"";

const initial=
getInitial(
message.userName
?
{displayName:message.userName}
:
user
);

const mine=
message.userId===currentUser.uid;

return `

<div class="message ${mine?"mine":""}" data-message-id="${escapeHtml(message.id)}">

<div
class="message-avatar"
style="background:${getAvatarColor(message.userId)}"
onclick="openUserProfile('${escapeHtml(message.userId)}')">

${
avatar
?
`<img src="${escapeHtml(avatar)}">`
:
escapeHtml(initial)
}

</div>

<div class="message-content">

<div
class="message-name"
onclick="openUserProfile('${escapeHtml(message.userId)}')">

${escapeHtml(name)}

</div>

<div class="message-text">

${escapeHtml(message.text)}

</div>

<div class="message-time">

${formatTime(message.createdAt)}

${mine?'<svg class="icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>':""}

</div>

</div>

</div>

`;

}
)
);

if(viewId!==messagesViewId)
return;

container.innerHTML=
html.join("");

container.scrollTop=
container.scrollHeight;

}

/* =====================================================
   SEND MESSAGE
   ===================================================== */

window.sendMessage=async()=>{

const input=
document.getElementById("messageInput");

const sendBtn=
document.getElementById("sendBtn");

const text=
input.value.trim();

if(!text)
return;

if(text.length>500){

showToast(
"Maximal 500 Zeichen."
);

return;

}

if(!currentUser)
return;

try{

sendBtn.disabled=true;

document
.getElementById("sendBtnLabel")
.textContent="...";

const data={

userId:
currentUser.uid,

userName:
getUserName(currentUserData),

text:text,

createdAt:
serverTimestamp()

};

/* =====================================================
   COMMUNITY
   ===================================================== */

if(currentMode==="community"){

await addDoc(
collection(
db,
"chatMessages"
),
data
);

}

/* =====================================================
   PRIVATE
   ===================================================== */

else if(currentMode==="private"){

if(
!currentPrivateChatId
||
!currentPrivateUserId
){

showToast(
"Privater Chat ist nicht verfügbar."
);

return;

}

if(
!friendsCache.some(
f=>f.uid===currentPrivateUserId
)
){

showToast(
"Nur Freunde können miteinander chatten."
);

return;

}

/*
   STEP 1
   Write the REAL message.

   The onSnapshot listener attached by
   listenMessages() is already live on this
   chat's "messages" subcollection, so it will
   render this message automatically the moment
   Firestore acknowledges the write - no manual
   re-fetch needed (that used to race with the
   listener and could make the message/chat
   flicker or disappear from the sidebar).
*/

await addDoc(
collection(
db,
"privateChats",
currentPrivateChatId,
"messages"
),
data
);

/*
   STEP 2
   Create/update the parent conversation doc.

   startConversationsListener() keeps a live
   onSnapshot on "privateChats" (participants
   array-contains me), so as soon as this write
   lands it will refresh the sidebar by itself.
   That's the SINGLE source of truth for the
   sidebar now - we no longer also do a manual
   getDocs() pull here, which used to overwrite
   the listener's fresher data with a stale
   snapshot and made the chat vanish from
   "Chats" after leaving it.
*/

await setDoc(
doc(
db,
"privateChats",
currentPrivateChatId
),
{

participants:[
currentUser.uid,
currentPrivateUserId
].sort(),

updatedAt:
serverTimestamp(),

lastMessage:
text,

lastMessageSenderId:
currentUser.uid

},
{
merge:true
}
);

}

/* =====================================================
   GROUP
   ===================================================== */

else if(currentMode==="group"){

if(
!currentGroupData
||
!currentGroupData.members?.includes(
currentUser.uid
)
){

showToast(
"Du bist kein Mitglied dieser Gruppe."
);

return;

}

if(currentGroupData.closed){

showToast(
"Diese Gruppe ist geschlossen."
);

return;

}

await addDoc(
collection(
db,
"groups",
currentGroupId,
"messages"
),
data
);

}

/*
   Clear only after successful sending.
*/

input.value="";

}catch(error){

console.error(
"SEND MESSAGE ERROR:",
error
);

showToast(
"Nachricht konnte nicht gesendet werden."
);

}finally{

sendBtn.disabled=false;

document
.getElementById("sendBtnLabel")
.textContent="Senden";

}

};

/* =====================================================
   FRIEND COUNT
   ===================================================== */

async function getFriendCount(uid){

try{

const snap=
await getDocs(
query(
collection(
db,
"friendships"
),
where(
"users",
"array-contains",
uid
)
)
);

return snap.size;

}catch{

return 0;

}

}

/* =====================================================
   FRIEND LISTENER
   ===================================================== */

function startFriendsListener(){

const q=
query(
collection(
db,
"friendships"
),
where(
"users",
"array-contains",
currentUser.uid
)
);

if(unsubscribeFriends)
unsubscribeFriends();

unsubscribeFriends=
onSnapshot(
q,
async snapshot=>{

const newFriends=[];

for(const item of snapshot.docs){

const data=
item.data();

const uid=
data.users.find(
x=>x!==currentUser.uid
);

if(!uid)
continue;

try{

const snap=
await getDoc(
doc(
db,
"users",
uid
)
);

if(snap.exists()){

newFriends.push({

uid,

friendshipId:
item.id,

...snap.data()

});

}

}catch(error){

console.error(

);

}

}

friendsCache=
newFriends;

friendsLoaded=true;

/*
   IMPORTANT:
   Conversations depend on friendsCache,
   so recompute them every time the friend
   list changes (new friend, removed friend).
*/

rebuildConversations();

if(currentMode==="friends"){

},

);

/* =====================================================
   BUILD CONVERSATIONS
   ===================================================== */

function rebuildConversations(){

if(!currentUser)
return;

/*
   IMPORTANT:
   Wait until friendsCache has loaded at least
   once. Otherwise, if the "privateChats"
   snapshot arrives before the friendships
   snapshot, every conversation gets filtered
   out below (friend not found yet) and never
   gets recomputed until the NEXT friendship
   change - which made freshly-sent private
   chats seem to disappear from the sidebar.
*/

if(!friendsLoaded)
return;

const conversations=[];

for(const chatDoc of conversationsDocsCache){

const data=
chatDoc.data;

if(
!data
||
!Array.isArray(data.participants)
||
data.participants.length!==2
){

continue;

}

const otherUid=
data.participants.find(
uid=>uid!==currentUser.uid
);

if(!otherUid)
continue;

/*
   IMPORTANT:
   No lastMessage = no conversation.
*/

if(
!data.lastMessage
||
!String(data.lastMessage).trim()
){

continue;

}

/*
   IMPORTANT:
   The other user MUST still be a friend.
*/

const friend=
friendsCache.find(
f=>f.uid===otherUid
);

if(!friend)
continue;

conversations.push({

id:chatDoc.id,

uid:otherUid,

...friend,

lastMessage:
data.lastMessage||"",

lastMessageSenderId:
data.lastMessageSenderId||null,

updatedAt:
data.updatedAt||null

});

}

conversations.sort(
(a,b)=>{

const aTime=
a.updatedAt?.toMillis?.()||0;

const bTime=
b.updatedAt?.toMillis?.()||0;

return bTime-aTime;

}
);

conversationsCache=
conversations;

renderConversations(
conversations
);

}

/* =====================================================
   CONVERSATION LISTENER
   ===================================================== */

function startConversationsListener(){

if(unsubscribeConversations){

unsubscribeConversations();

unsubscribeConversations=null;

}

const q=
query(
collection(
db,
"privateChats"
),
where(
"participants",
"array-contains",
currentUser.uid
)
);

/*
   IMPORTANT:
   This is now the ONLY place that writes to
   conversationsDocsCache. sendMessage() and
   openPrivateChat() no longer also pull the
   collection manually - having two async
   sources update the same cache was the race
   that made conversations flicker/disappear
   after leaving a chat.
*/

unsubscribeConversations=
onSnapshot(
q,
snapshot=>{

conversationsDocsCache=
snapshot.docs.map(
d=>({

id:d.id,

data:d.data()

})
);

rebuildConversations();

},
error=>{

console.error(
"CONVERSATIONS LISTENER ERROR:",
error
);

showToast(
"Chats konnten nicht geladen werden."
);

}
);

}

window.removeGroupMember=async function(uid){

if(!currentGroupId||!currentUser)
return;

if(uid===currentUser.uid){

showToast(
"Der Owner kann sich nicht selbst entfernen."
);

return;

}

try{

const ref=
doc(
db,
"groups",
currentGroupId
);

await runTransaction(
db,
async transaction=>{

const snap=
await transaction.get(ref);

if(!snap.exists())
throw new Error("notfound");

const group=
snap.data();

if(group.ownerId!==currentUser.uid)
throw new Error("owner");

if(group.closed)
throw new Error("closed");

if(uid===group.ownerId)
throw new Error("ownerremove");

if(
!group.members
||
!group.members.includes(uid)
)
throw new Error("nomember");

const members=
group.members.filter(
memberUid=>
memberUid!==uid
);

transaction.update(
ref,
{

members,

memberCount:
members.length

}
);

}
);

showToast(
"Mitglied wurde entfernt."
);

await openGroupSettings();

}catch(error){

console.error(
"REMOVE MEMBER ERROR:",
error
);

if(error.message==="owner"){

showToast(
"Nur der Owner kann Mitglieder entfernen."
);

}else if(error.message==="ownerremove"){

showToast(
"Der Owner kann nicht entfernt werden."
);

}else if(error.message==="closed"){

showToast(
"Die Gruppe ist geschlossen."
);

}else if(error.message==="nomember"){

showToast(
"Dieser Benutzer ist kein Mitglied."
);

}else{

showToast(
"Mitglied konnte nicht entfernt werden."
);

}

}

};

/* =====================================================
   ACCEPT GROUP INVITE
   ===================================================== */

window.acceptGroupInvite=async inviteId=>{

try{

const inviteRef=
doc(
db,
"groupInvites",
inviteId
);

const inviteSnap=
await getDoc(inviteRef);

if(!inviteSnap.exists()){

showToast(
"Einladung nicht gefunden."
);

return;

}

const invite=
inviteSnap.data();

if(
invite.toUid!==currentUser.uid
||
invite.status!=="pending"
){

showToast(
"Ungültige Einladung."
);

return;

}

const groupRef=
doc(
db,
"groups",
invite.groupId
);

await runTransaction(
db,
async transaction=>{

const groupSnap=
await transaction.get(groupRef);

if(!groupSnap.exists())
throw new Error("notfound");

const group=
groupSnap.data();

if(group.closed)
throw new Error("closed");

if(
group.members.includes(
currentUser.uid
)
){

transaction.update(
inviteRef,
{

status:"accepted",

respondedAt:
serverTimestamp()

}
);

return;

}

if(
group.members.length>=MAX_GROUP_MEMBERS
)
throw new Error("full");

const members=[
...group.members,
currentUser.uid
];

transaction.update(
groupRef,
{

members,

memberCount:
members.length

}
);

transaction.update(
inviteRef,
{

status:"accepted",

respondedAt:
serverTimestamp()

}
);

}
);

closeModal(
"requestsModal"
);

showToast(
"Du bist der Gruppe beigetreten!"
);

setTimeout(
()=>openGroup(invite.groupId),
300
);

}catch(error){

console.error(
"ACCEPT GROUP ERROR:",
error
);

if(error.message==="full"){

showToast(
"Die Gruppe ist bereits voll."
);

}else{

showToast(
"Gruppe konnte nicht beigetreten werden."
);

}

}

};

/* =====================================================

   ===================================================== */

window.acceptFriendRequest=
async function(
requestId,
fromUid
){

try{

const requestRef=
doc(
db,
"friendRequests",
requestId
);

const friendshipId=[
currentUser.uid,
fromUid
]
.sort()
.join("_");

const friendshipRef=
doc(
db,
"friendships",
friendshipId
);

const myCount=
await getFriendCount(
currentUser.uid
);

const theirCount=
await getFriendCount(
fromUid
);

if(myCount>=MAX_FRIENDS){

showToast(
"Du hast bereits 100 Freunde."
);

return;

}

if(theirCount>=MAX_FRIENDS){

showToast(
"Dieser User hat bereits 100 Freunde."
);

return;

}

await runTransaction(
db,
async transaction=>{

const req=
await transaction.get(
requestRef
);

const friendship=
await transaction.get(
friendshipRef
);

if(!req.exists()){

throw new Error("request");

}

if(friendship.exists()){

throw new Error("already");

}

const data=
req.data();

if(
data.toUid!==currentUser.uid
||
data.status!=="pending"
){

throw new Error("invalid");

}

transaction.set(
friendshipRef,
{

users:[
currentUser.uid,
fromUid
].sort(),

createdAt:
serverTimestamp()

}
);

transaction.update(
requestRef,
{

status:"accepted",

respondedAt:
serverTimestamp()

}
);

}
);

showToast(
"Freundschaft angenommen!"
);

await openRequests();

}catch(error){

console.error(
"ACCEPT FRIEND ERROR:",
error
);

if(error.message==="already"){

showToast(
"Ihr seid bereits Freunde."
);

}else if(error.message==="request"){

showToast(
"Freundschaftsanfrage wurde nicht gefunden."
);

}else if(error.message==="invalid"){

showToast(
"Diese Anfrage ist nicht mehr gültig."
);

}else{

showToast(
"Freundschaft konnte nicht angenommen werden."
);

}

}

};
