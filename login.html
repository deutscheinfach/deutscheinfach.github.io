<div class="container">

    <a href="index.html" class="back-button">
        ← الرجوع للموقع
    </a>


    <div class="card">

        <h1>
            تسجيل الدخول
        </h1>

        <p class="subtitle">

<!-- Firebase -->

<script type="module">

    import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


    import {
        getAuth,
        signInWithEmailAndPassword,
        setPersistence,
        browserLocalPersistence
    }
    from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


    import {
        getFirestore,
        doc,
        getDoc
    }
    from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


    /* =========================
       FIREBASE CONFIG
    ========================= */

    const firebaseConfig = {

        apiKey: "AIzaSyDHMmaHLYRRHfdRDj-hf7s5LOqeWPTiOxU",

        authDomain: "deutsch-einfach-4c81f.firebaseapp.com",

        projectId: "deutsch-einfach-4c81f",

        storageBucket: "deutsch-einfach-4c81f.firebasestorage.app",

        messagingSenderId: "152448766933",

        appId: "1:152448766933:web:f7824c4db8ab3caccbe35c"

    };


    /* =========================
       INITIALIZE FIREBASE
    ========================= */

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    /* =========================
       LOGIN FORM
    ========================= */

    const form =
        document.getElementById("login-form");

    const button =
        document.getElementById("login-button");


    form.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("password")
                    .value;


            try {

                button.disabled = true;

                button.textContent =
                    "جاري تسجيل الدخول...";


                /* =========================
                   SAVE LOGIN SESSION
                ========================= */

                await setPersistence(
                    auth,
                    browserLocalPersistence
                );


                /* =========================
                   LOGIN
                ========================= */

                const userCredential =
                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                const user =
                    userCredential.user;


                /* =========================
                   GET FIRESTORE USER
                ========================= */

                const userDoc =
                    await getDoc(
                        doc(
                            db,
                            "users",
                            user.uid
                        )
                    );


                if (userDoc.exists()) {

                    console.log(
                        "معلومات المستخدم:",
                        userDoc.data()
                    );

                }


                /* =========================
                   SUCCESS
                ========================= */

                alert(
                    "تم تسجيل الدخول بنجاح ✅"
                );


                window.location.href =
                    "dashboard.html";


            }

            catch (error) {

                console.error(
                    "Login error:",
                    error
                );


                if (
                    error.code ===
                        "auth/invalid-credential" ||

                    error.code ===
                        "auth/wrong-password" ||

                    error.code ===
                        "auth/user-not-found"
                ) {

                    alert(
                        "الإيميل أو كلمة المرور غير صحيحة ❌"
                    );

                }

                else if (
                    error.code ===
                    "auth/invalid-email"
                ) {

                    alert(
                        "الإيميل غير صحيح ❌"
                    );

                }

                else {

                    alert(
                        "وقع مشكل أثناء تسجيل الدخول ❌\n" +
                        "حاول مرة أخرى."
                    );

                }


                button.disabled = false;

                button.textContent =
                    "تسجيل الدخول";

            }

        }
    );

</script>
