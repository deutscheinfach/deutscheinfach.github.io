<!DOCTYPE html>

<html lang="de" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تسجيل الدخول – Deutsch Einfach</title>

<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #f8f8f8, #ffffff);
        color: #222;
    }

    .container {
        width: 90%;
        max-width: 500px;
        margin: auto;
        padding: 40px 20px;
    }

    .back-button {
        display: inline-block;
        margin-bottom: 25px;
        padding: 11px 18px;
        background: #111;
        color: white;
        text-decoration: none;
        border-radius: 10px;
        font-weight: bold;
        transition: 0.3s;
    }

    .back-button:hover {
        background: #333;
        transform: translateY(-2px);
    }

    .card {
        background: white;
        padding: 35px;
        border-radius: 25px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.10);
    }

    h1 {
        text-align: center;
        color: #d60000;
        margin-top: 0;
        margin-bottom: 10px;
    }

    .subtitle {
        text-align: center;
        color: #666;
        margin-bottom: 30px;
        font-size: 16px;
        line-height: 1.7;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
        color: #333;
    }

    input {
        width: 100%;
        padding: 14px;
        margin-bottom: 20px;
        border: 1px solid #ddd;
        border-radius: 10px;
        font-size: 16px;
        outline: none;
    }

    input:focus {
        border-color: #d60000;
    }

    .forgot-password {
        display: block;
        text-align: left;
        color: #d60000;
        text-decoration: none;
        font-size: 14px;
        font-weight: bold;
        margin-top: -10px;
        margin-bottom: 20px;
    }

    .forgot-password:hover {
        text-decoration: underline;
    }

    .login-submit {
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 12px;
        background: #d60000;
        color: white;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
    }

    .login-submit:hover {
        background: #a80000;
        transform: translateY(-2px);
    }

    .login-submit:disabled {
        background: #999;
        cursor: not-allowed;
        transform: none;
    }

    .signup-text {
        text-align: center;
        margin-top: 25px;
        color: #555;
    }

    .signup-text a {
        color: #d60000;
        font-weight: bold;
        text-decoration: none;
    }

    .signup-text a:hover {
        text-decoration: underline;
    }

</style>

</head>

<body>

<div class="container">

    <a href="index.html" class="back-button">
        ← الرجوع للموقع
    </a>

    <div class="card">

        <h1>
            تسجيل الدخول
        </h1>

        <p class="subtitle">
            مرحباً بك من جديد في Deutsch Einfach
            <br>
            سجل الدخول باش تكمل التحضير لـ TELC B1 & B2
        </p>

        <form id="login-form">

            <label for="email">
                البريد الإلكتروني
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="example@gmail.com"
                required
            >

            <label for="password">
                كلمة المرور
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="دخل كلمة المرور"
                required
            >

            <a href="forgot-password.html" class="forgot-password">
                نسيت كلمة المرور؟
            </a>

            <button
                type="submit"
                class="login-submit"
                id="login-button"
            >
                تسجيل الدخول
            </button>

        </form>

        <p class="signup-text">

            ما عندكش حساب؟

            <a href="signup.html">
                إنشاء حساب
            </a>

        </p>

    </div>

</div>


<!-- =========================
     FIREBASE
========================= -->

<script type="module">

    import {
        initializeApp
    }
    from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


    import {
        getAuth,
        signInWithEmailAndPassword,
        setPersistence,
        browserLocalPersistence
    }
    from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


    import {
        getFirestore,
        doc,
        getDoc,
        setDoc
    }
    from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


    /* =========================
       FIREBASE CONFIG
    ========================= */

    const firebaseConfig = {

        apiKey:
            "AIzaSyDHMmaHLYRRHfdRDj-hf7s5LOqeWPTiOxU",

        authDomain:
            "deutsch-einfach-4c81f.firebaseapp.com",

        projectId:
            "deutsch-einfach-4c81f",

        storageBucket:
            "deutsch-einfach-4c81f.firebasestorage.app",

        messagingSenderId:
            "152448766933",

        appId:
            "1:152448766933:web:f7824c4db8ab3caccbe35c",

        measurementId:
            "G-9QV234Z0KZ"

    };


    /* =========================
       INITIALIZE FIREBASE
    ========================= */

    const app =
        initializeApp(firebaseConfig);

    const auth =
        getAuth(app);

    const db =
        getFirestore(app);


    /* =========================
       DEVICE ID
    ========================= */

    let deviceId =
        localStorage.getItem(
            "deutschEinfachDeviceId"
        );


    if (!deviceId) {

        deviceId =
            crypto.randomUUID();

        localStorage.setItem(
            "deutschEinfachDeviceId",
            deviceId
        );

    }


    /* =========================
       LOGIN FORM
    ========================= */

    const form =
        document.getElementById(
            "login-form"
        );

    const button =
        document.getElementById(
            "login-button"
        );


    form.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("password")
                    .value;


            try {

                button.disabled = true;

                button.textContent =
                    "جاري تسجيل الدخول...";


                /* =========================
                   PERSISTENCE
                ========================= */

                await setPersistence(
                    auth,
                    browserLocalPersistence
                );


                /* =========================
                   LOGIN
                ========================= */

                const userCredential =
                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                const user =
                    userCredential.user;


                /* =========================
                   CREATE NEW SESSION
                ========================= */

                const sessionId =
                    crypto.randomUUID();


                console.log(
                    "🔥 New session:",
                    sessionId
                );


                /* =========================
                   USER DOCUMENT
                ========================= */

                const userRef =
                    doc(
                        db,
                        "users",
                        user.uid
                    );


                /* =========================
                   GET OLD DATA
                ========================= */

                const oldUserDoc =
                    await getDoc(
                        userRef
                    );


                let oldData = {};

                if (oldUserDoc.exists()) {

                    oldData =
                        oldUserDoc.data();

                }


                /* =========================
                   SAVE NEW SESSION
                ========================= */

                await setDoc(
                    userRef,
                    {

                        ...oldData,

                        email:
                            user.email ||
                            email,

                        name:
                            user.displayName ||
                            oldData.name ||
                            "",

                        sessionId:
                            sessionId,

                        deviceId:
                            deviceId,

                        sessionUpdatedAt:
                            new Date()

                    },
                    {
                        merge: true
                    }
                );


                console.log(
                    "✅ New session saved in Firestore"
                );


                /* =========================
                   SAVE SESSION LOCALLY
                ========================= */

                localStorage.setItem(
                    "deutschEinfachSessionId",
                    sessionId
                );


                console.log(
                    "✅ Local session saved:",
                    localStorage.getItem(
                        "deutschEinfachSessionId"
                    )
                );


                /* =========================
                   SUCCESS
                ========================= */

                alert(
                    "تم تسجيل الدخول بنجاح ✅"
                );


                window.location.replace(
                    "dashboard.html"
                );

            }


            catch (error) {

                console.error(
                    "❌ Login error:",
                    error
                );


                if (
                    error.code ===
                        "auth/invalid-credential" ||

                    error.code ===
                        "auth/wrong-password" ||

                    error.code ===
                        "auth/user-not-found"
                ) {

                    alert(
                        "الإيميل أو كلمة المرور غير صحيحة ❌"
                    );

                }

                else if (
                    error.code ===
                    "auth/invalid-email"
                ) {

                    alert(
                        "الإيميل غير صحيح ❌"
                    );

                }

                else {

                    alert(
                        "وقع مشكل أثناء تسجيل الدخول ❌\n\n" +
                        "حاول مرة أخرى."
                    );

                }


                button.disabled = false;

                button.textContent =
                    "تسجيل الدخول";

            }

        }
    );

</script>

</body>

</html>
