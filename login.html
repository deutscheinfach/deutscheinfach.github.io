<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>تسجيل الدخول – Deutsch Einfach</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/theme.css">
<style>
/* ============================================
   Deutsch Einfach — Thème Noir & Or
   Design responsive: mobile / tablette / PC / grand écran
   ============================================ */

:root {
  --bg: #08090c;
  --bg-soft: #0d0f14;
  --surface: #121419;
  --surface-2: #181b22;
  --border: rgba(255, 255, 255, 0.08);
  --border-strong: rgba(212, 175, 55, 0.35);
  --gold: #d4af37;
  --gold-light: #f4e5a1;
  --gold-dark: #a8842a;
  --text: #f5f4f0;
  --text-dim: #b9b6ad;
  --text-faint: #7c7a72;
  --radius: 18px;
  --shadow-gold: 0 0 40px -10px rgba(212, 175, 55, 0.25);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: "Cairo", "IBM Plex Sans Arabic", system-ui, sans-serif;
  direction: rtl;
  text-align: right;
  line-height: 1.7;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  position: relative;
  overflow-x: hidden;
}

img {
  max-width: 100%;
  display: block;
}

a {
  color: inherit;
  text-decoration: none;
}

/* Background texture */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -2;
  background:
    radial-gradient(circle at 15% 10%, rgba(212, 175, 55, 0.10), transparent 40%),
    radial-gradient(circle at 85% 30%, rgba(212, 175, 55, 0.06), transparent 45%),
    linear-gradient(180deg, #08090c 0%, #0a0b10 100%);
}

.bg-grid {
  position: fixed;
  inset: 0;
  z-index: -1;
  background-size: 44px 44px;
  background-image:
    linear-gradient(to right, rgba(212, 175, 55, 0.04) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(212, 175, 55, 0.04) 1px, transparent 1px);
  -webkit-mask-image: radial-gradient(circle at 50% 30%, black 0%, transparent 70%);
  mask-image: radial-gradient(circle at 50% 30%, black 0%, transparent 70%);
}

/* ---------- Auth card ---------- */
.auth-wrap {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.auth-card {
  width: 100%;
  max-width: 440px;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: 24px;
  padding: 40px 34px;
  box-shadow: var(--shadow-gold);
}

.auth-logo {
  display: flex;
  justify-content: center;
  margin-bottom: 18px;
}

.logo {
  width: 84px;
  height: 84px;
  object-fit: cover;
  border-radius: 50%;
  border: 3px solid var(--gold);
  box-shadow: var(--shadow-gold);
}

h1 {
  text-align: center;
  font-size: clamp(22px, 3vw, 27px);
  font-weight: 900;
  margin: 4px 0 6px;
  background: linear-gradient(135deg, var(--gold-light), var(--gold));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.subtitle {
  text-align: center;
  color: var(--text-dim);
  font-size: 14px;
  margin-bottom: 30px;
}

/* ---------- Form ---------- */
.form-group {
  margin-bottom: 18px;
}

label {
  display: block;
  font-size: 13.5px;
  font-weight: 700;
  margin-bottom: 8px;
  color: var(--text-dim);
}

input {
  width: 100%;
  padding: 13px 16px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--bg-soft);
  color: var(--text);
  font-family: inherit;
  font-size: 15px;
  outline: none;
  transition: 0.2s;
  direction: ltr;
  text-align: left;
}

input::placeholder {
  color: var(--text-faint);
}

input:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
}

.login-button {
  width: 100%;
  border: none;
  padding: 14px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--gold-light), var(--gold) 55%, var(--gold-dark));
  color: #1a1400;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
  transition: 0.25s ease;
  margin-top: 6px;
  box-shadow: var(--shadow-gold);
}

.login-button:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 30px -8px rgba(212, 175, 55, 0.45);
}

.login-button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
}

/* ---------- Messages ---------- */
.error,
.success {
  display: none;
  border-radius: 12px;
  padding: 12px 16px;
  margin-bottom: 18px;
  text-align: center;
  font-size: 13.5px;
  line-height: 1.6;
}

.error {
  background: rgba(220, 38, 38, 0.12);
  border: 1px solid rgba(220, 38, 38, 0.35);
  color: #fca5a5;
}

.success {
  background: rgba(34, 197, 94, 0.1);
  border: 1px solid rgba(34, 197, 94, 0.3);
  color: #86efac;
}

.loading {
  display: none;
  text-align: center;
  color: var(--text-faint);
  margin-top: 14px;
  font-size: 13px;
}

/* ---------- Links ---------- */
.links {
  text-align: center;
  margin-top: 24px;
  line-height: 2;
  font-size: 14px;
  color: var(--text-dim);
}

.links a {
  color: var(--gold-light);
  font-weight: 700;
}

.links a:hover {
  text-decoration: underline;
}

.back-home {
  display: block;
  text-align: center;
  margin-top: 18px;
  color: var(--text-faint);
  font-size: 13px;
}

.back-home:hover {
  color: var(--gold-light);
}

/* ============================================
   Responsive — mobile / tablette / PC / TV
   ============================================ */

/* Mobile */
@media (max-width: 480px) {
  body {
    padding: 16px;
  }
  .auth-card {
    padding: 30px 22px;
    border-radius: 20px;
  }
  .logo {
    width: 70px;
    height: 70px;
  }
}

/* Tablette */
@media (min-width: 700px) and (max-width: 1024px) {
  .auth-card {
    max-width: 480px;
    padding: 46px 40px;
  }
}

/* PC / grands écrans */
@media (min-width: 1440px) {
  .auth-card {
    max-width: 500px;
    padding: 52px 46px;
  }
  h1 {
    font-size: 30px;
  }
  .subtitle {
    font-size: 15px;
  }
  input {
    padding: 15px 18px;
    font-size: 16px;
  }
  .login-button {
    padding: 16px;
    font-size: 17px;
  }
}

/* Très grands écrans / TV */
@media (min-width: 2200px) {
  .auth-card {
    max-width: 620px;
    padding: 64px 56px;
    border-radius: 30px;
  }
  h1 {
    font-size: 38px;
  }
  .subtitle {
    font-size: 18px;
  }
  label {
    font-size: 16px;
  }
  input {
    padding: 18px 22px;
    font-size: 19px;
    border-radius: 14px;
  }
  .login-button {
    padding: 20px;
    font-size: 20px;
    border-radius: 14px;
  }
  .links,
  .back-home {
    font-size: 16px;
  }
}

/* ===== إظهار كلمة المرور ===== */
.password-wrap { position: relative; }

.password-wrap input { padding-inline-start: 46px; }

.password-toggle {
    position: absolute;
    inset-inline-start: 6px;
    top: 50%;
    transform: translateY(-50%);
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    border-radius: 9px;
    background: transparent;
    color: var(--muted, #b9b6ad);
    cursor: pointer;
    padding: 0;
    transition: .2s;
}
.password-toggle:hover { background: rgba(212,175,55,.14); color: var(--gold-soft, #f4e5a1); }
.password-toggle svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.password-toggle .off { display: none; }
.password-toggle.shown .on { display: none; }
.password-toggle.shown .off { display: block; }

</style>
</head>

<body>
<div class="bg-grid"></div>

<div class="auth-wrap">
  <div class="auth-card">

    <div class="auth-logo">
      <img src="icon1.png" alt="Deutsch Einfach" class="logo">
    </div>

    <h1>Deutsch Einfach 🇩🇪</h1>

    <div class="subtitle">تسجيل الدخول إلى حسابك</div>

    <div class="error" id="errorMessage"></div>
    <div class="success" id="successMessage"></div>

    <form id="loginForm">

      <div class="form-group">
        <label for="email">📧 البريد الإلكتروني</label>
        <input type="email" id="email" placeholder="example@email.com" autocomplete="email" required>
      </div>

      <div class="form-group">
        <label for="password">🔒 كلمة المرور</label>
        <div class="password-wrap">
        <input type="password" id="password" placeholder="كلمة المرور" autocomplete="current-password" required>
        <button type="button" class="password-toggle" aria-label="إظهار كلمة المرور"><svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg><svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg></button>
      </div>
      </div>

      <button type="submit" class="login-button" id="loginButton">تسجيل الدخول</button>

      <div class="loading" id="loading">⏳ جاري تسجيل الدخول...</div>

    </form>

    <div class="links">
      <div>
        ما عندكش حساب؟
        <a href="signup.html" id="signupLink">إنشاء حساب</a>
      </div>
      <div>
        <a href="forgot-password.html">نسيت كلمة المرور؟</a>
      </div>
    </div>

    <a href="index.html" class="back-home">← العودة إلى الصفحة الرئيسية</a>

  </div>
</div>

<script type="module">


/* =========================================
   FIREBASE
========================================= */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {

    getAuth,

    signInWithEmailAndPassword,

    setPersistence,

    browserLocalPersistence,

    browserSessionPersistence,

    inMemoryPersistence

}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {

    getFirestore,

    doc,

    getDoc,

    setDoc

}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyDHMmaHLYRRHfdRDj-hf7s5LOqeWPTiOxU",

    authDomain:
        "deutsch-einfach-4c81f.firebaseapp.com",

    projectId:
        "deutsch-einfach-4c81f",

    storageBucket:
        "deutsch-einfach-4c81f.firebasestorage.app",

    messagingSenderId:
        "152448766933",

    appId:
        "1:152448766933:web:f7824c4db8ab3caccbe35c",

    measurementId:
        "G-9QV234Z0KZ"

};


const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


const db =
    getFirestore(app);


/* =========================================
   أدوات آمنة ل iOS

   1) crypto.randomUUID() ماكايناش ف Safari قبل 15.4، و
      كانت كتطيح السكريبت كامل هنا، إذن زر الدخول ما كان
      كيخدم حتى شي حاجة ف الآيفونات القدام.
   2) ف التصفح الخاص ديال Safari، localStorage كيرمي
      استثناء ملي كتكتب فيه. كنغلفوه.
========================================= */

function makeId() {

    try {

        if (
            typeof crypto !== "undefined" &&
            typeof crypto.randomUUID === "function"
        ) {

            return crypto.randomUUID();

        }


        if (
            typeof crypto !== "undefined" &&
            typeof crypto.getRandomValues === "function"
        ) {

            const bytes =
                crypto.getRandomValues(
                    new Uint8Array(16)
                );

            /* نفس شكل UUID v4 */
            bytes[6] = (bytes[6] & 0x0f) | 0x40;
            bytes[8] = (bytes[8] & 0x3f) | 0x80;

            const hex =
                Array.from(
                    bytes,
                    function(b) {
                        return b
                            .toString(16)
                            .padStart(2, "0");
                    }
                ).join("");

            return (
                hex.slice(0, 8) + "-" +
                hex.slice(8, 12) + "-" +
                hex.slice(12, 16) + "-" +
                hex.slice(16, 20) + "-" +
                hex.slice(20)
            );

        }

    }

    catch (error) {

        /* كنطيحو للحل الأخير تحت */

    }


    return (
        "id-" +
        Date.now().toString(36) + "-" +
        Math.random().toString(36).slice(2, 10) +
        Math.random().toString(36).slice(2, 10)
    );

}


function safeGet(key) {

    try {

        return localStorage.getItem(key);

    }

    catch (error) {

        return null;

    }

}


function safeSet(key, value) {

    try {

        localStorage.setItem(key, value);

        return true;

    }

    catch (error) {

        return false;

    }

}


/* =========================================
   DEVICE ID
========================================= */

let deviceId =
    safeGet(
        "deutschEinfachDeviceId"
    );


if (!deviceId) {

    deviceId =
        makeId();

    safeSet(
        "deutschEinfachDeviceId",
        deviceId
    );

}


/* =========================================
   ALLOWED PAGES
========================================= */

const allowedPages = [

    "index.html",

    "dashboard.html",

    "chat.html",

    "b1-lesen.html",

    "b1-lesen-teil1.html",

    "b1-hoeren.html",

    "b1-schreiben.html",

    "b1-sprechen.html",

    "b2-lesen.html",

    "b2-lesen-teil1.html",

    "b2-lesen-teil2.html",

    "b2-lesen-teil3.html",

    "b2-lesen-sprach1.html",

    "b2-lesen-sprach2.html",

    "b2-hoeren.html",

    "b2-hoeren-teil2.html",

    "b2-hoeren-teil3.html",

    "b2-schreiben.html",

    "b2-sprechen.html"

];


/* =========================================
   CHECK ALLOWED RETURN PAGE
========================================= */

function isAllowedReturnPage(value) {

    if (!value) {

        return false;

    }


    try {

        const url =
            new URL(
                value,
                window.location.origin
            );


        /*
         * SECURITY:
         * ممنوع نرجعو لموقع خارجي
         */

        if (
            url.origin !==
            window.location.origin
        ) {

            return false;

        }


        const page =
            url.pathname
                .split("/")
                .pop();


        return allowedPages.includes(
            page
        );

    }

    catch (error) {

        return false;

    }

}


/* =========================================
   NORMALIZE RETURN PAGE
========================================= */

function normalizeReturnTo(value) {

    if (!value) {

        return "index.html";

    }


    try {

        const url =
            new URL(
                value,
                window.location.origin
            );


        if (
            !isAllowedReturnPage(value)
        ) {

            return "index.html";

        }


        const page =
            url.pathname
                .split("/")
                .pop();


        /*
         * مهم بزاف:
         *
         * dashboard.html?section=lesen
         *
         * غادي تبقى كاملة
         */

        return (

            page +

            url.search +

            url.hash

        );

    }

    catch (error) {

        return "index.html";

    }

}


/* =========================================
   FIND WHERE USER CAME FROM
========================================= */

let returnTo =
    sessionStorage.getItem(
        "deutschEinfachReturnTo"
    );


/*
 * 1️⃣ sessionStorage
 */

if (!returnTo) {

    const params =
        new URLSearchParams(
            window.location.search
        );

    returnTo =
        params.get("returnTo");

}


/*
 * 2️⃣ document.referrer
 */

if (!returnTo) {

    try {

        const referrer =
            document.referrer;


        if (referrer) {

            const refUrl =
                new URL(
                    referrer,
                    window.location.origin
                );


            /*
             * نخليو غير نفس الموقع
             */

            if (
                refUrl.origin ===
                window.location.origin
            ) {

                const previousPage =
                    refUrl.pathname
                        .split("/")
                        .pop();


                if (
                    allowedPages.includes(
                        previousPage
                    )
                ) {

                    returnTo =

                        previousPage +

                        refUrl.search +

                        refUrl.hash;

                }

            }

        }

    }

    catch (error) {

        console.log(
            "Could not detect previous page."
        );

    }

}


/*
 * 3️⃣ Normalize
 */

returnTo =
    normalizeReturnTo(
        returnTo
    );


console.log(
    "Return page:",
    returnTo
);


/* =========================================
   SIGNUP LINK
========================================= */

const signupLink =
    document.getElementById(
        "signupLink"
    );


signupLink.href =
    "signup.html?returnTo=" +
    encodeURIComponent(
        returnTo
    );


/* =========================================
   ELEMENTS
========================================= */

const loginForm =
    document.getElementById(
        "loginForm"
    );


const loginButton =
    document.getElementById(
        "loginButton"
    );


const loading =
    document.getElementById(
        "loading"
    );


const errorMessage =
    document.getElementById(
        "errorMessage"
    );


const successMessage =
    document.getElementById(
        "successMessage"
    );


/* =========================================
   SHOW ERROR
========================================= */

function showError(message) {

    errorMessage.textContent =
        message;

    errorMessage.style.display =
        "block";

    successMessage.style.display =
        "none";

}


/* =========================================
   SHOW SUCCESS
========================================= */

function showSuccess(message) {

    successMessage.textContent =
        message;

    successMessage.style.display =
        "block";

    errorMessage.style.display =
        "none";

}


/* =========================================
   LOGIN
========================================= */

loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        errorMessage.style.display =
            "none";

        successMessage.style.display =
            "none";


        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        if (!email || !password) {

            showError(
                "⚠️ عافاك دخل البريد الإلكتروني وكلمة المرور."
            );

            return;

        }


        loginButton.disabled =
            true;

        loading.style.display =
            "block";


        try {


            /* =========================
               FIREBASE PERSISTENCE
            ========================= */

            /* التصفح الخاص ف iOS كيسد IndexedDB، و
               browserLocalPersistence كيطيح. كنجربو واحد
               ورا الآخر باش الدخول يبقى خدام على أي حال. */
            for (
                const mode of [
                    browserLocalPersistence,
                    browserSessionPersistence,
                    inMemoryPersistence
                ]
            ) {

                try {

                    await setPersistence(
                        auth,
                        mode
                    );

                    break;

                }

                catch (error) {

                    console.warn(
                        "Persistence mode refused, trying the next one:",
                        error
                    );

                }

            }


            /* =========================
               SIGN IN
            ========================= */

            const userCredential =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            const user =
                userCredential.user;


            /* =========================
               SESSION ID
            ========================= */

            const sessionId =
                makeId();


            /* =========================
               GET USER DATA
            ========================= */

            const userRef =
                doc(
                    db,
                    "users",
                    user.uid
                );


            const userSnap =
                await getDoc(
                    userRef
                );


            let userName =
                user.displayName ||
                email
                    .split("@")[0];


            if (
                userSnap.exists()
            ) {

                const data =
                    userSnap.data();


                if (data.name) {

                    userName =
                        data.name;

                }

            }


            /* =========================
               SAVE USER SESSION
            ========================= */

            await setDoc(

                userRef,

                {

                    email:
                        user.email,

                    name:
                        userName,

                    sessionId:
                        sessionId,

                    deviceId:
                        deviceId,

                    sessionUpdatedAt:
                        new Date()

                },

                {
                    merge: true
                }

            );


            /* =========================
               SAVE LOCAL SESSION
            ========================= */

            safeSet(

                "deutschEinfachSessionId",

                sessionId

            );


            /* =========================
               SUCCESS
            ========================= */

            showSuccess(
                "✅ تم تسجيل الدخول بنجاح!"
            );


            /*
             * مهم:
             * ما نحيدوش returnTo
             * قبل redirect إلا من بعد
             */

            sessionStorage.removeItem(
                "deutschEinfachReturnTo"
            );


            /*
             * ننتاظرو شوية باش
             * يبان success
             */

            setTimeout(

                function() {

                    window.location.replace(
                        returnTo
                    );

                },

                500

            );


        }

        catch (error) {

            console.error(
                "Login error:",
                error
            );


            /* بلا التفصيل، أي مشكل ف الآيفون كيبان
               بحال بحال ومحال تعرف السبب. */
            let message =
                "❌ وقع مشكل ف تسجيل الدخول. (" +
                (error && (error.code || error.message)
                    ? String(error.code || error.message)
                    : "سبب مجهول") +
                ")";


            if (
                error.code ===
                "auth/invalid-credential"
            ) {

                message =
                    "❌ البريد الإلكتروني أو كلمة المرور غير صحيحة.";

            }

            else if (
                error.code ===
                "auth/user-not-found"
            ) {

                message =
                    "❌ هاد الحساب ما كاينش.";

            }

            else if (
                error.code ===
                "auth/wrong-password"
            ) {

                message =
                    "❌ كلمة المرور غير صحيحة.";

            }

            else if (
                error.code ===
                "auth/invalid-email"
            ) {

                message =
                    "❌ البريد الإلكتروني غير صحيح.";

            }

            else if (
                error.code ===
                "auth/too-many-requests"
            ) {

                message =
                    "⚠️ كاينين محاولات كثيرة. حاول من بعد.";

            }


            showError(
                message
            );


            loginButton.disabled =
                false;

            loading.style.display =
                "none";

        }

    }
);

</script>


<script>
/* عين إظهار كلمة المرور.

   كنبدلو type غير ديال الخانة اللي حدا الزر — بلا هادشي
   الضغطة كانت تبين جميع كلمات السر فالصفحة. */
document.querySelectorAll(".password-toggle").forEach(function (button) {

  button.addEventListener("click", function () {

    var input = button.parentElement.querySelector("input");

    if (!input) return;

    var hidden = input.type === "password";

    input.type = hidden ? "text" : "password";

    button.classList.toggle("shown", hidden);

    button.setAttribute(
      "aria-label",
      hidden ? "إخفاء كلمة المرور" : "إظهار كلمة المرور"
    );

    /* المؤشر كيرجع للآخر ملي يتبدل النوع — كنرجعوه */
    var end = input.value.length;
    input.focus();
    try { input.setSelectionRange(end, end); } catch (e) {}

  });

});
</script>
