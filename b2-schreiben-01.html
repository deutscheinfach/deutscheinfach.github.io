<audio id="success-sound" src="../applause.mp3" preload="auto" style="display:none;"></audio>

<div class="main-content">
    <div class="task-side" id="schreiben-task-side">
        <div class="yellow-box">Zeit: 30 Minuten | Mindestens 150 Wörter</div>
        <p>Lade Übung …</p>
    </div>

    <div class="writing-side">
        <div class="word-counter">
            <div class="counter-left">
                <span>Wörter: <span id="count">0</span> / 150</span>
                <span>Zeichen: <span id="char-count">0</span></span>
            </div>
            <div class="button-container telc-action-button-container">
            <button class="btn-green quiz-button" id="check-btn" onclick="checkText()">
                🔍 Text überprüfen
            </button>
            <button type="button" onclick="resetQuiz()" class="quiz-button secondary telc-global-reset-btn" id="resetQuizButton" data-telc-reset="1">
                <i class="fas fa-redo" aria-hidden="true"></i> Zurücksetzen
            </button>
            </div>
        </div>
        <div class="textarea-container">
            <textarea id="essay" class="schreiben-textarea schreiben-textarea" placeholder="Fangen Sie hier an zu schreiben..."></textarea>
        </div>

        <div id="correction-panel" class="correction-panel">
            <div class="correction-header">
                <div class="correction-title">📝 Korrektur-Ergebnisse</div>
                <button class="close-btn" onclick="closeCorrection()">✕ Schließen</button>
            </div>
            <div id="correction-content"></div>
        </div>
    </div>
</div>
