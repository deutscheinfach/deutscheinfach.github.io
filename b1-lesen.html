<!DOCTYPE html>
<html lang="de" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>B1 Lesen – Deutsch Einfach</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #f8f8f8,
                    #eeeeee
                );

            min-height: 100vh;

        }


        .container {

            max-width: 1000px;

            margin: auto;

            padding: 30px 20px;

        }


        .header {

            background: white;

            padding: 25px;

            border-radius: 18px;

            text-align: center;

            box-shadow:
                0 8px 25px
                rgba(0,0,0,0.10);

            margin-bottom: 25px;

        }


        .header h1 {

            margin: 0;

            color: #d60000;

        }


        .header p {

            color: #555;

            margin-bottom: 0;

        }


        .parts {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(250px, 1fr)
                );

            gap: 20px;

        }


        .card {

            background: white;

            border-radius: 18px;

            padding: 25px;

            box-shadow:
                0 8px 25px
                rgba(0,0,0,0.10);

            text-align: center;

            transition:
                transform 0.2s;

        }


        .card:hover {

            transform:
                translateY(-5px);

        }


        .card h2 {

            margin-top: 0;

            color: #333;

        }


        .card p {

            color: #666;

            line-height: 1.6;

        }


        .open-button {

            border: none;

            background: #d60000;

            color: white;

            padding: 13px 25px;

            border-radius: 10px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }


        .open-button:hover {

            background: #a90000;

        }


        .locked {

            opacity: 0.65;

        }


        .locked-button {

            border: none;

            background: #888;

            color: white;

            padding: 13px 25px;

            border-radius: 10px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }


        .back-button {

            display: block;

            width: fit-content;

            margin: 30px auto 0;

            padding: 12px 25px;

            background: #333;

            color: white;

            text-decoration: none;

            border-radius: 10px;

        }


        .loading {

            position: fixed;

            inset: 0;

            background: white;

            display: flex;

            align-items: center;

            justify-content: center;

            z-index: 9999;

            font-size: 20px;

            font-weight: bold;

            color: #d60000;

        }

    </style>

</head>


<body>


<div
    class="loading"
    id="loading"
>
    🇩🇪 جاري التحقق من الحساب...
</div>



<div class="container">

    <div class="header">

        <h1>
            📖 B1 Lesen
        </h1>

        <p>
            Leseverstehen – TELC B1
        </p>

    </div>



    <div class="parts">


        <!-- TEIL 1 -->

        <div class="card">

            <h2>
                Teil 1
            </h2>

            <p>
                Lies die Texte und
                beantworte die Fragen.
            </p>

            <button
                class="open-button"
                onclick="openTeil1()"
            >
                ▶ Teil 1 starten
            </button>

        </div>



        <!-- TEIL 2 -->

        <div class="card locked">

            <h2>
                🔒 Teil 2
            </h2>

            <p>
                Dieser Teil ist noch
                nicht verfügbar.
            </p>

            <button
                class="locked-button"
                onclick="lockedTeil()"
            >
                🔒 Gesperrt
            </button>

        </div>



        <!-- TEIL 3 -->

        <div class="card locked">

            <h2>
                🔒 Teil 3
            </h2>

            <p>
                Dieser Teil ist noch
                nicht verfügbar.
            </p>

            <button
                class="locked-button"
                onclick="lockedTeil()"
            >
                🔒 Gesperrt
            </button>

        </div>


    </div>



    <a
        href="b1.html"
        class="back-button"
    >
        ← Zurück zu B1
    </a>

</div>



<script type="module">

/* =========================
   FIREBASE
========================= */

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";



const firebaseConfig = {

    apiKey:
        "AIzaSyDHMmaHLYRRHfdRDj-hf7s5LOqeWPTiOxU",

    authDomain:
        "deutsch-einfach-4c81f.firebaseapp.com",

    projectId:
        "deutsch-einfach-4c81f",

    storageBucket:
        "deutsch-einfach-4c81f.firebasestorage.app",

    messagingSenderId:
        "152448766933",

    appId:
        "1:152448766933:web:f7824c4db8ab3caccbe35c",

    measurementId:
        "G-9QV234Z0KZ"

};



const app =
    initializeApp(
        firebaseConfig
    );


const auth =
    getAuth(app);



/* =========================
   AUTH CHECK
========================= */

onAuthStateChanged(
    auth,
    (user) => {

        if (!user) {

            /*
                حفظ الصفحة الحالية
                باش login يعرف فين يرجع
            */

            const currentPage =
                window.location.pathname
                    .split("/")
                    .pop() +
                window.location.search +
                window.location.hash;


            sessionStorage.setItem(

                "deutschEinfachReturnTo",

                currentPage

            );


            window.location.replace(
                "login.html"
            );


            return;
        }


        /*
            المستخدم داخل الحساب
        */

        document
            .getElementById("loading")
            .style.display = "none";

    }
);



/* =========================
   OPEN TEIL 1
========================= */

function openTeil1() {

    window.location.href =
        "b1-lesen-teil1.html";

}



/* =========================
   LOCKED
========================= */

function lockedTeil() {

    alert(

        "🔒 Dieser Teil ist noch nicht verfügbar.\n\n" +

        "Demnächst bei Deutsch Einfach! 🇩🇪"

    );

}



/* =========================
   MAKE FUNCTIONS AVAILABLE
========================= */

window.openTeil1 =
    openTeil1;

window.lockedTeil =
    lockedTeil;

</script>


</body>

</html>
